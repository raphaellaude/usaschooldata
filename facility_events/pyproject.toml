[project]
name = "facility-events"
version = "0.1.0"
description = "Collect and categorize school facility events (closures, renovations, expansions, redistricting) from public sources"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "duckdb>=1.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
]

[project.scripts]
facility-events = "collect.cli:main"
