  district: Houston ISD
  state: TX
  leaid: '48236400'
  event_type: intervention
  date: June 2025
  title: TEA Takeover Extended to 2027
  schools_affected:
  - name: District-wide
  description: 'TEA Commissioner Mike Morath extended state control of HISD until at least June 1, 2027.
    Three criteria must be met for a return to local control: no campuses failing for multiple consecutive
    years, special education compliance, and the board demonstrating proper governance.'
  sources:
  - url: https://www.khou.com/article/news/education/houston-isd-takeover-tea-extension-2027/285-cb9ac1c5-97c0-4cbb-b4cb-86b6bdf7f0ae
