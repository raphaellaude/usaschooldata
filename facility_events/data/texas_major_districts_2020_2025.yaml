  - name: Harvest Green ES (eliminated), transportation facility (deferred), fine arts/athletics projects
      (reduced)
  description: Shortly after projects began, a $165M deficit was discovered in the $1.26B bond program.
    Investigation showed district leaders failed to adjust costs for inflation when the bond was delayed
    from Nov 2022 to May 2023. On Oct. 21, 2024, trustees voted to eliminate the new Harvest Green elementary
    school ($47.6M), defer a transportation facility, and reduce fine arts/athletics projects.
