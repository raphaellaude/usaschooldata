# Texas Major School District Facility Events (2020-2025)
# Researched: 2026-02-08
# Focus: Houston ISD, Dallas ISD, Fort Worth ISD, Cypress-Fairbanks ISD,
#         Austin ISD, Northside ISD, Fort Bend ISD

events:
- date: June 2023
  description: TEA formally took over Houston ISD, replacing the elected school board with an appointed
    Board of Managers and installing Mike Miles (former Dallas ISD superintendent) as superintendent.
    The takeover was triggered by Wheatley High School receiving five consecutive F ratings under state
    accountability. At the time, HISD had a B+ accountability rating overall and a AAA bond rating.
  district: Houston ISD
  event_type: intervention
  schools_affected: All 270+ HISD campuses
  source: https://en.wikipedia.org/wiki/Houston_Independent_School_District_takeover
  title: TEA State Takeover
- date: August 2023
  description: Superintendent Miles launched the NES at 28 historically underperforming campuses. All
    staff were required to reapply for positions. Schools adopted extended 6:30 AM to 5 PM schedules,
    new curricula, and centralized budget management. Libraries were converted to "TEAMS centers." An
    additional 57 schools voluntarily joined as "NES-Aligned" campuses.
  district: Houston ISD
  event_type: intervention
  schools_affected: 28 campuses in Wheatley, Kashmere, and North Forest HS feeder patterns (including
    Kashmere HS, Wheatley HS, North Forest HS, Highland Heights ES, Henry MS, Sugar Grove Academy, Marshall
    ES, and others)
  source: https://www.chron.com/news/houston-texas/education/article/hisd-nes-schools-new-changes-18193178.php
  title: New Education System (NES) -- Phase 1 Restructuring
- date: August 2024
  description: HISD expanded NES to 45 more schools, 26 of which were required to join based on failing
    state ratings and 19 that joined voluntarily. This brought the total NES footprint to 130 campuses
    -- nearly half the district.
  district: Houston ISD
  event_type: intervention
  schools_affected: 45 additional campuses (including Austin High School and 18 elementary/middle schools),
    bringing total to 130 NES campuses
  source: https://www.houstonchronicle.com/news/houston-texas/education/article/hisd-new-education-system-schools-19588842.php
  title: NES Expansion -- Phase 2
- date: November 5, 2024
  description: 'Houston voters overwhelmingly rejected HISD''s $4.4 billion bond proposal (Prop A: $3.96B
    for facilities; Prop B: $440M for technology) by a 58-42% margin. It was the largest school bond in
    Texas history and the first $1B+ Texas school bond to fail. Both Democratic and Republican parties
    opposed it under the slogan "No Trust, No Bond," viewing it as a referendum on the state-appointed
    leadership. Miles estimated the district needs $10B in repairs.'
  district: Houston ISD
  event_type: bond
  schools_affected: District-wide (would have funded repairs/rebuilds across all campuses)
  source: https://www.khou.com/article/news/education/hisd-concedes-defeat-in-44-billion-bond-proposal/285-31f90a58-2dc4-452b-9d3d-4ba3ec99d992
  title: $4.4 Billion Bond Rejected
- date: August--November 2025
  description: At convocation, Miles announced he would propose closing up to 10 small schools due to
    declining enrollment (30,000 students lost in 10 years). Each closure would save approximately $2M/year.
    However, in November 2025, the district reversed course and announced no closures for the 2026-27
    school year, though "consolidations" may be considered later.
  district: Houston ISD
  event_type: closure
  schools_affected: Up to 10 unspecified "small" campuses
  source: https://www.houstonchronicle.com/news/houston-texas/education/hisd/article/potential-school-closures-convocation-20805198.php
  title: School Closures Proposed Then Reversed
- date: June 2025
  description: 'TEA Commissioner Mike Morath extended state control of HISD until at least June 1, 2027.
    Three criteria must be met for a return to local control: no campuses failing for multiple consecutive
    years, special education compliance, and the board demonstrating proper governance.'
  district: Houston ISD
  event_type: intervention
  schools_affected: District-wide
  source: https://www.khou.com/article/news/education/houston-isd-takeover-tea-extension-2027/285-cb9ac1c5-97c0-4cbb-b4cb-86b6bdf7f0ae
  title: TEA Takeover Extended to 2027
- date: 2025--2026 (planned)
  description: After the bond failure, HISD announced it would budget $100 million from its general fund
    for building updates and infrastructure over two years, reducing funds available for salaries and
    operations. The district faces a projected $250M budget deficit.
  district: Houston ISD
  event_type: renovation
  schools_affected: District-wide
  source: https://www.houstonchronicle.com/news/houston-texas/education/hisd/article/2025-year-preview-20392091.php
  title: $100M Infrastructure Spending from General Fund
- date: November 3, 2020
  description: Voters approved Proposition A ($3.2B for school construction, renovation, and equipment
    at 200+ of 230 campuses) and Proposition B ($270M for technology). Three other propositions for sports
    stadiums, performing arts, and swimming pools were rejected. The bond funds 14 new or replacement
    campuses.
  district: Dallas ISD
  event_type: bond
  schools_affected: 200+ campuses
  source: https://thehub.dallasisd.org/2020/11/04/voters-approve-two-dallas-isd-bond-propositions-totaling-nearly-3-5-billion-to-fund-infrastructure-and-technology-improvements/
  title: $3.47 Billion Bond Approved
- date: Fall 2024 (opened)
