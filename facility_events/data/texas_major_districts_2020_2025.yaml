- event_id: TX-48236400-intervention-202306-tea-state-takeover
  district: Houston ISD
  state: TX
  leaid: '48236400'
  event_type: intervention
  date: June 2023
  title: TEA State Takeover
  schools_affected:
  - name: All 270+ HISD campuses
  description: TEA formally took over Houston ISD, replacing the elected school board with an appointed
    Board of Managers and installing Mike Miles (former Dallas ISD superintendent) as superintendent.
    The takeover was triggered by Wheatley High School receiving five consecutive F ratings under state
    accountability. At the time, HISD had a B+ accountability rating overall and a AAA bond rating.
  sources:
  - url: https://en.wikipedia.org/wiki/Houston_Independent_School_District_takeover
  causes:
  - accountability
  - political_governance
- event_id: TX-48236400-intervention-202308-new-education-system-nes-phase
  district: Houston ISD
  state: TX
  leaid: '48236400'
  event_type: intervention
  date: August 2023
  title: New Education System (NES) -- Phase 1 Restructuring
  schools_affected:
  - name: 28 campuses in Wheatley, Kashmere, and North Forest HS feeder patterns (including Kashmere HS,
      Wheatley HS, North Forest HS, Highland Heights ES, Henry MS, Sugar Grove Academy, Marshall ES, and
      others)
  description: Superintendent Miles launched the NES at 28 historically underperforming campuses. All
    staff were required to reapply for positions. Schools adopted extended 6:30 AM to 5 PM schedules,
    new curricula, and centralized budget management. Libraries were converted to "TEAMS centers." An
    additional 57 schools voluntarily joined as "NES-Aligned" campuses.
  sources:
  - url: https://www.chron.com/news/houston-texas/education/article/hisd-nes-schools-new-changes-18193178.php
  causes:
  - accountability
  - new_construction
- event_id: TX-48236400-intervention-202408-nes-expansion-phase-2
  district: Houston ISD
  state: TX
  leaid: '48236400'
  event_type: intervention
  date: August 2024
  title: NES Expansion -- Phase 2
  schools_affected:
  - name: 45 additional campuses (including Austin High School and 18 elementary/middle schools), bringing
      total to 130 NES campuses
  description: HISD expanded NES to 45 more schools, 26 of which were required to join based on failing
    state ratings and 19 that joined voluntarily. This brought the total NES footprint to 130 campuses
    -- nearly half the district.
  sources:
  - url: https://www.houstonchronicle.com/news/houston-texas/education/article/hisd-new-education-system-schools-19588842.php
  causes:
  - accountability
- event_id: TX-48236400-bond-202411-44-billion-bond-rejected
  district: Houston ISD
  state: TX
  leaid: '48236400'
  event_type: bond
  date: November 5, 2024
  title: $4.4 Billion Bond Rejected
  schools_affected:
  - name: District-wide (would have funded repairs/rebuilds across all campuses)
  description: 'Houston voters overwhelmingly rejected HISD''s $4.4 billion bond proposal (Prop A: $3.96B
    for facilities; Prop B: $440M for technology) by a 58-42% margin. It was the largest school bond in
    Texas history and the first $1B+ Texas school bond to fail. Both Democratic and Republican parties
    opposed it under the slogan "No Trust, No Bond," viewing it as a referendum on the state-appointed
    leadership. Miles estimated the district needs $10B in repairs.'
  sources:
  - url: https://www.khou.com/article/news/education/hisd-concedes-defeat-in-44-billion-bond-proposal/285-31f90a58-2dc4-452b-9d3d-4ba3ec99d992
  causes:
  - facility_condition
  - political_governance
- event_id: TX-48236400-closure-202508-school-closures-proposed-then
  district: Houston ISD
  state: TX
  leaid: '48236400'
  event_type: closure
  date: August--November 2025
  title: School Closures Proposed Then Reversed
  schools_affected:
  - name: Up to 10 unspecified "small" campuses
  description: At convocation, Miles announced he would propose closing up to 10 small schools due to
    declining enrollment (30,000 students lost in 10 years). Each closure would save approximately $2M/year.
    However, in November 2025, the district reversed course and announced no closures for the 2026-27
    school year, though "consolidations" may be considered later.
  sources:
  - url: https://www.houstonchronicle.com/news/houston-texas/education/hisd/article/potential-school-closures-convocation-20805198.php
  causes:
  - consolidation_efficiency
  - enrollment_decline
  - underutilization
