- event_id: PA-42002000-closure-200609-pittsburgh-right-sizing-2006
  district: Pittsburgh Public Schools
  state: PA
  leaid: '42002000'
  event_type: closure
  date: 2006-09
  title: Pittsburgh Implements Right-Sizing Plan with Staff Cuts and School Changes
  schools_affected:
  - name: Multiple schools affected by restructuring
  description: 'In 2006, Pittsburgh Public Schools implemented a comprehensive Right-Sizing Plan that
    eliminated 252 staffing positions across administrators, teachers, paraprofessionals, clerical staff,
    and custodians. The plan restructured school feeder patterns, changed the instructional model to emphasize
    universal access to art, music, and physical education, and increased class sizes. The Right-Sizing
    Plan was the first major attempt to address the fundamental mismatch between PPS''s building capacity
    (designed for 40,000 students) and actual enrollment (approximately 25,000 at the time, declining
    to 18,000 by 2024). The 2006 plan set the template for the 2011 Realignment Plan and 2012 closures
    that followed.

    '
  sources:
