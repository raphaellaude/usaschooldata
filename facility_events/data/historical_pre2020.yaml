- event_id: DC-11001000-closure-201301-dcps-15-school-closures
  district: District of Columbia Public Schools
  state: DC
  leaid: '11001000'
  event_type: closure
  date: 2013-01
  title: DCPS Chancellor Henderson Closes 15 Schools
  schools_affected:
  - name: Spingarn Senior High School
  - name: Kenilworth Elementary School
  - name: Sharpe Health School
  - name: Mamie D. Lee School
  - name: 11 additional schools (15 total)
  description: 'In January 2013, DCPS Chancellor Kaya Henderson announced the closure of 15 schools —
    more than one in ten D.C. public schools — affecting over 2,400 students and 540 employees. The original
    proposal targeted 20 schools before community feedback reduced the list. All 15 schools were east
    of Rock Creek Park, many east of the Anacostia River in some of the city''s poorest neighborhoods,
    and all had below-average test scores. Thirteen schools closed at the end of the 2012-13 year, with
    two special education schools (Sharpe Health and Mamie D. Lee) closing in 2014. Henderson cited under-enrollment,
    underutilized facility space, and lack of modernization as factors, estimating $19.5 million in staffing
    savings. Parents filed suit in U.S. District Court (Case No. 1:13-CV-00420JEB) to halt the closures,
    but the suit was unsuccessful. This was the largest set of DCPS closures since 2008, when 23 schools
    were shuttered.

    '
  sources:
