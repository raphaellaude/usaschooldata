- event_id: TN-47001480-merger-201307-memphis-shelby-county-merger
  district: Memphis-Shelby County Schools
  state: TN
  leaid: '47001480'
  event_type: merger
  date: 2013-07
  title: Largest School District Merger in US History - Memphis and Shelby County
  schools_affected:
  - name: All Memphis City Schools (103,000 students)
  - name: All Shelby County Schools (47,000 students)
  description: 'On July 1, 2013, Memphis City Schools (103,000 students) and Shelby County Schools (47,000
    students) officially merged to form a unified district — the largest school district consolidation
    in American history. The merger originated in December 2010 when the Memphis City Schools board voted
    to surrender its charter, forcing a merger to prevent Shelby County Schools from gaining special school
    district status that would have limited funding for Memphis. Memphis city residents approved the charter
    dissolution in a March 2011 referendum. A federal judge ruled the merger constitutional despite Shelby
    County''s legal challenge. The Tennessee General Assembly created a Transition Planning Commission
    to oversee the process. For one year, the unified district became the 14th largest in the nation.
    However, six suburban municipalities — Arlington, Bartlett, Collierville, Germantown, Lakeland, and
    Millington — quickly voted to form their own breakaway districts, which began operating by the 2014-15
    school year after the Tennessee legislature lifted a ban on new school districts.

    '
  sources:
  - url: https://www.edweek.org/leadership/memphis-shelby-schools-merge-amid-uncertainty/2013/07
  - url: https://www.actionnews5.com/story/22736163/scs-mcs-officially-merge-into-one-school-district/
  - url: http://www.cnn.com/2011/US/08/08/tennessee.memphis.schools/index.html
  - url: https://en.wikipedia.org/wiki/Memphis-Shelby_County_Schools
  causes:
