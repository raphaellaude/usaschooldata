- event_id: LA-2200090-intervention-200511-new-orleans-rsd-state-takeover
  district: Recovery School District / Orleans Parish
  state: LA
  leaid: '2200090'
  event_type: intervention
  date: 2005-11
  title: Louisiana Takes Over 102 New Orleans Schools Post-Katrina
  schools_affected:
  - name: 102 of 126 Orleans Parish schools transferred to RSD
  description: 'In the aftermath of Hurricane Katrina (August 29, 2005), the Louisiana Legislature passed
    Act 35, dramatically expanding the Recovery School District''s authority. The RSD took over 102 of
    126 schools from the Orleans Parish School Board (OPSB) in late November 2005. Of the 24 remaining
    OPSB schools, seven were uninhabitable, 12 became charters, and five remained directly managed. This
    was the most sweeping state takeover of a school district in American history. The RSD gradually converted
    traditional public schools to charter schools — by 2014, 92% of New Orleans public schools were charters.
    The takeover sparked intense debate about race, democratic governance, and privatization, with Howard
    Fuller noting that many African Americans felt the reforms happened "to us and not with us." The RSD
    eventually operated 52 charter schools with no remaining direct-run schools, creating the nation''s
    first all-charter school system.

    '
  sources:
  - url: https://en.wikipedia.org/wiki/Recovery_School_District
  - url: https://educationresearchalliancenola.org/files/publications/A-New-First_FINAL.pdf
