- event_id: MI-26054300-renovation-201810-detroit-500m-facilities-assessment
  district: Detroit Public Schools Community District
  state: MI
  leaid: '26054300'
  event_type: renovation
  date: 2018-10
  title: DPSCD Facilities Assessment Identifies $500M in Immediate Capital Needs
  schools_affected:
  - name: All DPSCD school buildings assessed
  description: 'A comprehensive facilities assessment conducted in 2018 for the newly reconstituted Detroit
    Public Schools Community District pegged the district''s immediate capital needs at over $500 million,
    with the potential for costs to grow to $1.5 billion by 2023 if left unaddressed. The assessment highlighted
    that the 2016 state bailout legislation had focused on operating debt relief but did not provide resources
    for capital needs. Moody''s warned that "mounting capital needs now threaten DPSCD''s long-term stability"
    and suggested the district might need another state bailout. The facilities crisis encompassed deteriorating
    buildings, inadequate heating and cooling systems, structural deficiencies, and in some cases, environmental
    hazards. The assessment underscored the lasting infrastructure damage from decades of emergency management,
    school closures, and deferred maintenance.

    '
  sources:
  - url: https://crcmich.org/recent-report-shows-continued-financial-improvement-for-detroit-schools
