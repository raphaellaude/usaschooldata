  schools_affected:
  - name: Multiple schools closed (number peaked at 178 in 2008, reduced to ~155 by 2012)
  - name: Wisconsin Avenue School (closed 2007)
  - name: Malcolm X building (vacant since 2007)
  description: 'Milwaukee Public Schools experienced a sustained period of school closures from its peak
    of 178 schools in 2008, gradually reducing to approximately 149 schools. MPS lost 30,000 students
    since 2006, driven significantly by Wisconsin''s school voucher program (which saw 33% enrollment
    growth since 2009) and charter school expansion (175% growth). The district accumulated approximately
    two dozen empty buildings and many more underutilized facilities. Only 21 of MPS schools were built
    after 1970, with buildings averaging over 80 years old. In January 2011, MPS labeled all empty buildings
    as "surplus" for sale, but reversed course six months later when charter and private schools expressed
    interest, refusing to allow voucher or charter schools to purchase the buildings. Buildings like the
    Malcolm X facility (vacant since 2007) have cost taxpayers over $200,000 in maintenance since 2012.
    The facilities crisis reflects a broader national pattern of public school enrollment decline in cities
    with robust school choice programs.

    '
