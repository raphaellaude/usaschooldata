- event_id: TN-47001480-redistricting-201408-shelby-county-6-municipal-breakaways
  district: Shelby County Schools (breakaway districts)
  state: TN
  leaid: '47001480'
  event_type: redistricting
  date: 2014-08
  title: Six Suburban Districts Break Away From Unified Shelby County System
  schools_affected:
  - name: Arlington Community Schools (new district)
  - name: Bartlett City Schools (new district)
  - name: Collierville Schools (new district)
  - name: Germantown Municipal School District (new district)
  - name: Lakeland School System (new district)
  - name: Millington Municipal Schools (new district)
  description: 'Following the 2013 Memphis-Shelby County Schools merger, six incorporated suburbs overwhelmingly
    voted in July 2013 to form their own municipal school districts. After the Tennessee General Assembly
    lifted a statewide ban on forming new school districts, these six suburbs — Arlington, Bartlett, Collierville,
    Germantown, Lakeland, and Millington — began operating their own districts by the 2014-15 school year.
    The suburban secession was driven largely by opposition to the merger with Memphis, where 85% of students
    were African American and 87% low-income, compared to the mostly white, middle-class suburban schools.
    A federal judge had initially ruled the breakaway efforts unconstitutional in November 2012, but the
    state legislature''s intervention enabled the municipalities to proceed. The secession reduced the
    unified district''s enrollment and raised concerns about resegregation and equitable funding.

    '
  sources:
  - url: https://en.wikipedia.org/wiki/Memphis-Shelby_County_Schools
  - url: https://eric.ed.gov/?id=EJ1185375
  - url: https://www.edweek.org/leadership/memphis-shelby-schools-merge-amid-uncertainty/2013/07
  causes:
