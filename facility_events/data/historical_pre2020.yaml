- event_id: MI-26054300-intervention-201606-detroit-617m-bailout-restructuring
  district: Detroit Public Schools
  state: MI
  leaid: '26054300'
  event_type: intervention
  date: 2016-06
  title: Michigan Passes $617M Bailout and Restructures DPS into New District
  schools_affected:
  - name: All DPS schools (district-wide restructuring, ~97 schools)
  description: 'On June 21, 2016, Governor Rick Snyder signed a $617 million bailout and restructuring
    package for Detroit Public Schools, modeled after the 2009 GM bankruptcy restructuring. The legislation
    split DPS into two entities: the "old" DPS retained to collect property taxes and pay down $515 million
    in operating debt, and a new, debt-free Detroit Public Schools Community District (DPSCD) created
    to educate students. The new district was returned to an elected school board in January 2017. The
    bailout included $467 million for legacy debt and $150 million in start-up funding. DPS had cycled
    through four state-appointed emergency managers since 2009 and accumulated $3.5 billion in long-term
    debt. The legislation notably did not address the district''s estimated $500 million in immediate
    capital needs. The narrowly passed package (55-54 in the House, 19-18 in the Senate) did not include
    a proposed Detroit Education Commission to regulate charter school locations, which was blocked by
    the charter school lobby.

    '
  sources:
