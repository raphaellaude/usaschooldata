- event_id: TX-48014900-bond-201411-katy-isd-748m-bond
  district: Katy Independent School District
  state: TX
  leaid: '48014900'
  event_type: bond
  date: 2014-11
  title: Katy ISD Voters Approve $748M Bond for School Construction
  schools_affected:
  - name: Multiple new campus construction projects
  - name: Legacy Stadium ($72M high school football stadium)
  description: 'In November 2014, voters in the Katy Independent School District (suburban Houston) approved
    a $748.2 million bond for campus construction, renovation, and development projects. The bond was
    one of the largest single-district school bonds approved in 2014 nationally and reflected the rapid
    suburban growth in the Houston metropolitan area. The bond funded construction of new schools to accommodate
    enrollment growth, facility renovations, and notably included Legacy Stadium, a $72 million high school
    football stadium that became one of the most expensive high school athletic facilities in the country.
    The rapid growth of suburban Houston-area school districts like Katy ISD contrasted sharply with the
    enrollment declines experienced by urban districts during the same period.

    '
