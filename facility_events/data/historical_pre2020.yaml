- event_id: CA-06227100-bond-200811-lausd-7b-measure-q
  district: Los Angeles Unified School District
  state: CA
  leaid: '06227100'
  event_type: bond
  date: 2008-11
  title: LAUSD Voters Approve $7B Measure Q for School Construction
  schools_affected:
  - name: All LAUSD schools (district-wide, 750+ sites)
  description: 'In November 2008, Los Angeles Unified School District voters approved Measure Q, a $7
    billion general obligation bond for school facility construction and improvement. This was the fifth
    bond voters approved in eleven years, following Proposition BB (1997), Measures K, R, and Y. The bond
    addressed critical needs as more than 77% of LAUSD''s 750+ school sites were at least 50 years old.
    In 2014, the Board of Education approved the School Upgrade Program (SUP) framework to manage and
    prioritize Measure Q funds, with an initial funding allocation of $7.8 billion. The district''s building
    program, which ended in 2017, helped increase capacity during a period of enrollment that subsequently
    shifted to decline — by the 2020s, 43% fewer students attended LAUSD schools than two decades prior.
    Measure Q was supported by Mayor Antonio Villaraigosa but received lukewarm support from traditional
    allies and criticism from the LA Times for being "far too vague."

    '
