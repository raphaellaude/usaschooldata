- event_id: NJ-34126900-closure-201409-newark-one-newark-closures
  district: Newark Public Schools
  state: NJ
  leaid: '34126900'
  event_type: closure
  date: 2014-09
  title: One Newark Plan Closes and Consolidates 12+ Schools
  schools_affected:
  - name: Madison Avenue School
  - name: Hawthorne Avenue School
  - name: Bragaw Avenue School
  - name: Alexander Street School
  - name: Newton Street School
  - name: Eighteenth Avenue School
  - name: Additional early childhood centers
  description: 'Superintendent Cami Anderson''s "One Newark" plan, backed by $200 million in private philanthropy
    (including Mark Zuckerberg''s $100 million gift), closed or consolidated more than 12 schools beginning
    in the 2014-15 school year. The plan eliminated neighborhood schools in favor of a citywide enrollment
    lottery, expanded charter school programs, and prompted mass firings of principals and teachers. Since
    2009, Newark closed 13 schools — largely in poor, heavily African-American South and West wards —
    several of which were turned over to charter management organizations. Black students comprised 51%
    of the district but 86% of those affected by closures. In January 2014, five principals who spoke
    against the plan were suspended. The Education Law Center declared the closures illegal for failing
    to comply with state regulations. Federal civil rights complaints were filed in 2012-2014, and a federal
    investigation was launched in July 2014. Anderson stepped down on July 8, 2015, after Mayor Ras Baraka
    — elected on an anti-reform platform — and community opposition made her position untenable. The episode
    is widely cited as a cautionary tale of top-down education philanthropy.

    '
  sources:
