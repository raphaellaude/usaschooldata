- event_id: TN-47001480-intervention-201308-shelby-county-achievement-school-district
  district: Shelby County Schools / Achievement School District
  state: TN
  leaid: '47001480'
  event_type: intervention
  date: 2013-08
  title: Tennessee Achievement School District Expands in Memphis
  schools_affected:
  - name: Multiple low-performing Memphis schools transferred to ASD
  description: 'The Tennessee Achievement School District (ASD), created in 2010 to take over the state''s
    lowest-performing schools (bottom 5%), expanded its presence in Memphis following the 2013 merger.
    The ASD converted failing traditional public schools to charter management, aiming to move them from
    the bottom 5% to the top 25% within five years. The program was part of Tennessee''s broader education
    reform strategy but faced criticism for removing schools from local democratic control and disproportionately
    affecting communities of color in Memphis. The ASD''s track record was mixed — while some schools
    showed improvement, many fell short of the ambitious targets. The expansion coincided with the already
    turbulent merger period, adding another layer of complexity to Memphis-Shelby County''s education
    landscape.

    '
  sources:
