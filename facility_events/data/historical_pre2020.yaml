- event_id: NJ-34126900-intervention-201609-newark-return-local-control
  district: Newark Public Schools
  state: NJ
  leaid: '34126900'
  event_type: intervention
  date: 2016-09
  title: Newark Schools Begin Return to Local Control After 21 Years of State Takeover
  schools_affected:
  - name: All Newark Public Schools (district-wide governance change)
  description: 'In September 2016, the New Jersey Department of Education began the process of returning
    control of Newark Public Schools to local governance, ending a state takeover that began in 1995.
    The state had appointed superintendents for over two decades, including the controversial Cami Anderson.
    Under newly appointed Superintendent Christopher Cerf (later succeeded by Roger Leon), the district
    began meeting milestones required for full local control. The return followed years of community activism,
    particularly after the contentious One Newark plan. Mayor Ras Baraka, elected in 2014 on a platform
    opposing the state-controlled reforms, was instrumental in advocating for the return. The district
    eventually achieved full local control, marking the end of one of the longest-running state takeovers
    of a school district in the United States.

    '
