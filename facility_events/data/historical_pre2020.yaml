- event_id: LA-2200090-merger-201807-new-orleans-reunification-opsb
  district: Orleans Parish School Board / NOLA Public Schools
  state: LA
  leaid: '2200090'
  event_type: merger
  date: 2018-07
  title: New Orleans Schools Reunify Under Local Board After 13 Years of State Control
  schools_affected:
  - name: All 86 New Orleans public schools returned to OPSB oversight
  description: 'On July 1, 2018, all New Orleans public schools under the state Recovery School District
    returned to the oversight of the locally elected Orleans Parish School Board, completing a reunification
    process mandated by Act 91 (signed May 2016 by Governor John Bel Edwards). Nine charter schools transferred
    early for the 2017-18 year, including FirstLine Schools (Ashe, Green, Langston Hughes, Wheatley),
    Collegiate Academies'' Abramson Sci Academy, and Choice Foundation schools (Lafayette Academy, Esperanza
    Charter). The reunified OPSB became the nation''s first district to oversee a citywide system of public
    charter schools. The transition preserved charter school autonomy while returning democratic accountability
    to a locally elected board for the first time since 2005. Seven schools serving specialized populations
    remained outside the unified district under state or legislative authority.

    '
  sources:
  - url: https://www.nola.com/news/education/article_51fe63a4-832f-5a27-bbb5-97430938404a.html
