- event_id: GA-13003300-intervention-201304-atlanta-cheating-scandal-indictments
  district: Atlanta Public Schools
  state: GA
  leaid: '13003300'
  event_type: intervention
  date: 2013-03
  title: Atlanta Cheating Scandal - 35 Educators Indicted Under RICO
  schools_affected:
  - name: 44 of 56 APS schools implicated in cheating
  - name: Parks Middle School
  - name: Hope-Hill Elementary School
  - name: Dobbs Elementary School
  description: 'In 2013, a Fulton County grand jury indicted 35 educators from Atlanta Public Schools
    on racketeering charges under Georgia''s RICO Act for their roles in a systematic test cheating scandal
    on the 2009 CRCT standardized tests. A Georgia Bureau of Investigation report found that 44 of 56
    schools had engaged in cheating, with 178 educators implicated. The state concluded the system maintained
    a "culture of fear, intimidation and retaliation." The trial, which began September 29, 2014 and lasted
    eight months (the longest criminal trial in Georgia history), resulted in 11 of 12 defendants being
    convicted on April 1, 2015. Lead prosecutor was Fani Willis. Superintendent Beverly Hall, at the center
    of the scandal, was indicted but died of breast cancer before trial. An estimated 7,064 students had
    test scores altered, with 98% of students with 10+ wrong-to-right erasures being Black. The scandal
    led to comprehensive reforms under new Superintendent Maria Carstarphen, including ethics training
    for 100% of staff by December 2014 and replacement of principals and teachers at affected schools.

    '
