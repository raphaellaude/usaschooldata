  - name: Community colleges statewide ($2 billion)
  description: 'On November 8, 2016, California voters approved Proposition 51 with 55.18% support, authorizing
    $9 billion in general obligation bonds for education facility construction and improvements — $7 billion
    for K-12 schools and $2 billion for community colleges. The K-12 funding was designated for new construction,
    modernization, career technical education facilities, and charter school facilities. Total state costs
    were estimated at $17.6 billion including interest over 35 years, with payments of approximately $500
    million per year. The measure was the first statewide school bond since 2006. It was notably opposed
    by Governor Jerry Brown, who called it "a blunderbuss effort that promotes sprawl and squanders money"
    and argued that local bonds were more effective. Critics warned that well-funded districts with consultants
    would have a better chance of applying for and receiving funds than smaller, poorer districts. The
    initiative was placed on the ballot by the Coalition for Adequate School Housing and the California
    Building Industry Association after collecting nearly 366,000 signatures.

    '
