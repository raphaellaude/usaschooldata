- event_id: MI-26054300-intervention-201501-detroit-earley-emergency-manager
  district: Detroit Public Schools
  state: MI
  leaid: '26054300'
  event_type: intervention
  date: 2015-01
  title: Michigan Appoints 4th Emergency Manager for DPS - Former Flint EM Earley
  schools_affected:
  - name: All DPS schools (~97 schools, 46,000 students)
  description: 'In January 2015, Michigan Governor Rick Snyder appointed Darnell Earley as the fourth
    state-appointed emergency manager for Detroit Public Schools since 2009. Earley had previously served
    as emergency manager of the City of Flint, where his administration made the disastrous decision to
    switch the city''s water supply from Detroit''s system to the Flint River — a move linked to elevated
    lead levels and a deadly Legionnaires'' disease outbreak. His appointment to DPS was met with outrage.
    By this point, DPS had accumulated $169.4 million in deficit despite hundreds of millions in cuts,
    and enrollment had fallen to about 47,000. Debt payments were set to balloon from $6.6 million to
    $26.8 million per month, threatening to bankrupt the district by April 2016, with over 40% of state-allocated
    per-pupil funding diverted to banks and bondholders. Earley''s tenure set the stage for the 2016 legislative
    bailout.

    '
