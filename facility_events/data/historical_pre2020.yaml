- event_id: CO-08033600-closure-201206-denver-zerger-closure-portfolio-model
  district: Denver Public Schools
  state: CO
  leaid: 08033600
  event_type: closure
  date: 2012-06
  title: DPS Closes Zerger Elementary as Part of Portfolio Management Model
  schools_affected:
  - name: Zerger Elementary School (closed, later became charter school site)
  description: 'Denver Public Schools closed Zerger Elementary School in 2012 as part of its portfolio
    management approach to education reform. The building was subsequently used to house a public charter
    school. Zerger''s closure was part of a broader DPS strategy during the 2008-2015 period in which
    the district opened 65 new schools while closing, replacing, or restarting 35 others. A comprehensive
    study later found that students who transferred from closed schools to new reform-era schools saw
    significant academic gains in math, validating the closure-and-replacement model in Denver''s context.
    The portfolio model made Denver a nationally studied example of market-based education reform, though
    community resistance eventually led to the abandonment of the School Performance Compact policy in
    2018.

    '
  sources:
  - url: https://www.cpr.org/2023/11/13/whats-happening-with-closed-school-buildings/
