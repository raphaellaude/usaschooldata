- event_id: CA-06246000-closure-201206-ousd-4-elementary-closures
  district: Oakland Unified School District
  state: CA
  leaid: '06246000'
  event_type: closure
  date: 2012-06
  title: OUSD Closes Four Elementary Schools in Flatlands Communities
  schools_affected:
  - name: Lakeview Elementary School
  - name: Marshall Elementary School
  - name: Maxwell Park Elementary School
  - name: Santa Fe Elementary School
  description: 'In October 2011, the Oakland Unified School District board voted 5-2 to close five elementary
    schools, with four ultimately closing at the end of the 2011-12 school year: Lakeview, Marshall, Maxwell
    Park, and Santa Fe Elementary Schools. All were located in the flatlands of East and West Oakland
    and served majority Black and Latinx populations. Re-enrollment rates in OUSD ranged from 79% to 91%
    across the four schools. Students from each closed school were assigned to receiving schools with
    better academic outcomes. The closures were part of a broader pattern — between 2004 and 2019, OUSD
    closed 19 traditional public schools, all in flatlands communities. Community opposition included
    parents building a tent city at Lakeview Elementary with help from Occupy Oakland protesters in June
    2012. Notably, 14 of 18 schools closed since 2004 became or now house charter schools, fueling community
    resentment over privatization.

    '
  sources:
