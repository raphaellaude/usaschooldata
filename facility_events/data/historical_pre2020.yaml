  title: DPS Adopts School Performance Compact - Closes/Restarts Struggling Schools
  schools_affected:
  - name: Gilpin Montessori (closed)
  - name: 2 additional schools (restarted with new programming)
  description: 'In 2015, the Denver Public Schools board adopted the School Performance Compact, a policy
    driven not by declining enrollment but by a desire to boost student test scores. The policy called
    for closing schools with a history of low ratings and replacing them with new programming. Under the
    policy, DPS closed Gilpin Montessori and "restarted" two other schools. A major study examining DPS
    reforms from 2008-09 through 2014-15 found that students who left closed schools and attended new
    reform-era schools saw the largest positive effects in math, while students who stayed in low-performing
    turnaround schools actually performed worse. During the study period, DPS opened 65 new schools and
    closed, replaced, or restarted 35 others as part of its portfolio management strategy. However, significant
    community pushback led the board to abandon the School Performance Compact in 2018.

    '
