- event_id: PA-42189900-closure-201303-philadelphia-24-school-closures
  district: School District of Philadelphia
  state: PA
  leaid: '42189900'
  event_type: closure
  date: 2013-03
  title: Philadelphia SRC Votes to Close 24 Schools Amid $1.35B Shortfall
  schools_affected:
  - name: Germantown High School
  - name: Bok Technical High School
  - name: University City High School
  - name: 21 additional schools (24 total, mostly elementary)
  description: 'On March 7, 2013, the School District of Philadelphia''s appointed School Reform Commission
    (SRC) voted to close 23 public schools, with a 24th added on April 18. The closures were driven by
    a $1.35 billion budget shortfall as federal stimulus funds expired. The original proposal targeted
    37 schools before Superintendent William Hite pared the list. Nearly 10,000 students were displaced
    from schools located almost entirely in low-income communities of color, amounting to about one in
    ten district-managed schools. AFT President Randi Weingarten was arrested protesting the action. The
    closures were followed by a "doomsday budget" for 2013-14 that eliminated funding for paper and new
    books, and 3,783 layoffs including 676 teachers and 283 counselors. Federal civil rights complaints
    were filed alleging discrimination against Black and Hispanic students and students with disabilities.
    Ten years later, several former school buildings remain vacant, while four became charter schools
    and two were converted to residential use.

    '
  sources:
  - url: https://www.npr.org/2013/03/08/173843054/faced-with-massive-budget-cuts-philadelphia-plans-to-shutter-23-schools
  - url: https://www.cbsnews.com/philadelphia/news/2013-in-review-district-closes-24-philadelphia-public-schools/
  - url: https://philadelphianeighborhoods.com/2023/05/11/education-the-lasting-effects-of-the-2013-school-closures/
  - url: https://www.inquirer.com/philly/education/20130310_A_Snapshot__The_23_Closing_Schools_in_Philadelphia.html
  - url: https://www.washingtonpost.com/news/answer-sheet/wp/2013/06/08/philadelphia-school-district-laying-off-3783-employees/
