- event_id: IL-17099300-closure-201206-chicago-cps-pre-mass-closures
  district: Chicago Public Schools
  state: IL
  leaid: '17099300'
  event_type: closure
  date: 2012-06
  title: CPS Closes 6 Schools and Co-Locates Charters Under Utilization Formula
  schools_affected:
  - name: 6 school buildings closed at end of 2011-12 year
  - name: Multiple co-locations with charter schools approved
  description: 'Before the 2013 mass closures, Chicago Public Schools closed six schools at the end of
    the 2011-12 school year using a new "utilization formula" developed by CEO Jean-Claude Brizard (who
    preceded Byrd-Bennett). The closures were accompanied by controversial decisions to co-locate charter
    schools in existing CPS buildings, sparking community protests. The district also released data showing
    140 schools were "underutilized," building the analytical framework that Byrd-Bennett would later
    use to justify the far larger 2013 closure wave. The 2012 closures, combined with the contentious
    2012 Chicago Teachers Union strike over school closures and evaluations, set the stage for the largest
    mass closure in US history the following year.

    '
  sources:
