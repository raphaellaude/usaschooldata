- event_id: DC-11001000-closure-200806-dcps-23-school-closures-fenty-rhee
  district: District of Columbia Public Schools
  state: DC
  leaid: '11001000'
  event_type: closure
  date: 2008-06
  title: DCPS Chancellor Rhee Closes 23 Schools Under Mayor Fenty
  schools_affected:
  - name: 23 public schools closed across DC
  description: 'In 2008, DCPS Chancellor Michelle Rhee, appointed by Mayor Adrian Fenty, closed 23 public
    schools in a major consolidation effort driven by declining enrollment and the need to modernize remaining
    facilities. The closures, concentrated in lower-income communities east of Rock Creek Park, displaced
    thousands of students and sparked significant community opposition. Rhee''s aggressive reform agenda,
    which included the closures alongside controversial teacher evaluation and dismissal policies, became
    a flashpoint in national education reform debates. The 2008 closures set the precedent for Chancellor
    Henderson''s 2013 round of 15 additional closures. Together, the two rounds eliminated approximately
    38 schools from the DCPS portfolio in five years.

    '
  sources:
