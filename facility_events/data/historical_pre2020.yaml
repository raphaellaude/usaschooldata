- event_id: IL-17099300-bond-201501-chicago-cps-fiscal-crisis-borrowing
  district: Chicago Public Schools
  state: IL
  leaid: '17099300'
  event_type: bond
  date: 2015-01
  title: CPS Faces Fiscal Crisis with $1B+ Annual Deficits and Junk Bond Rating
  schools_affected:
  - name: All CPS schools (district-wide fiscal impact)
  description: 'By 2015, Chicago Public Schools was deep in a fiscal crisis with annual budget deficits
    exceeding $1 billion, driven by pension obligations, declining enrollment, and rising debt service
    costs. Moody''s downgraded CPS debt to junk status, making the district the largest school system
    in the country with a junk bond rating. The fiscal pressure that had driven the 2013 mass closures
    continued unabated, with the district''s pension fund only 52% funded. CPS increasingly relied on
    short-term borrowing at unfavorable rates to make ends meet. The financial crisis constrained capital
    investment in school buildings, deferred maintenance across the district''s 600+ facilities, and created
    ongoing tension between the district, the Chicago Teachers Union, and state lawmakers over funding
    reform.

    '
  sources:
  - url: https://www.chicagobusiness.com/crains-forum-cps-crossroads/chicago-school-closures-2013-decade-later
