  - racial_equity
  - underutilization
- event_id: IL-17099300-intervention-201510-cps-byrd-bennett-bribery
  district: Chicago Public Schools
  state: IL
  leaid: '17099300'
  event_type: intervention
  date: 2015-10
  title: CPS CEO Byrd-Bennett Pleads Guilty in $23M Bribery Scheme
  schools_affected:
  - name: District-wide (contract affected principal training programs)
  description: 'Former CPS CEO Barbara Byrd-Bennett, who oversaw the 2013 mass school closures, pleaded
    guilty on October 13, 2015 to one count of wire fraud in a $23 million bribery and kickback scheme.
    She steered no-bid contracts to SUPES Academy and Synesi Associates, companies where she had formerly
    worked, in exchange for promised kickbacks including trust funds for relatives and a future hiring
    commitment. Co-conspirators Gary Solomon and Thomas Vranas split about $2.9 million from the deals.
    Byrd-Bennett was sentenced to 4.5 years in prison in April 2017. The scandal highlighted the contradiction
    of closing 50 schools to save money while spending $23 million on no-bid consulting contracts. A CPS
    Inspector General report found Byrd-Bennett helped the companies land $67 million in total contracts.

    '
  sources:
  - url: https://www.justice.gov/usao-ndil/pr/former-chief-executive-chicago-public-schools-pleads-guilty-accepting-bribes-and
  - url: https://news.wttw.com/2015/10/08/former-cps-ceo-barbara-byrd-bennett-plead-guilty-bribery-scheme
  - url: https://www.cnn.com/2015/10/08/us/chicago-schools-bribery-case/index.html
  - url: https://news.wttw.com/2018/07/31/cps-watchdog-byrd-bennett-helped-company-land-67m-contracts
