- event_id: LA-2200090-intervention-201605-new-orleans-act-91-reunification-law
  district: Recovery School District / Orleans Parish
  state: LA
  leaid: '2200090'
  event_type: intervention
  date: 2016-05
  title: Louisiana Governor Signs Act 91 Mandating New Orleans School Reunification
  schools_affected:
  - name: All 52 RSD charter schools to transfer to OPSB by 2018-2019
  description: 'On May 12, 2016, Governor John Bel Edwards signed SB 432 into law as Act 91, mandating
    that all Recovery School District schools in New Orleans be returned to the locally elected Orleans
    Parish School Board by July 1, 2018 (with possible extension to 2019). The legislation preserved charter
    school autonomy while restoring local democratic oversight. The law was the product of years of advocacy
    by community leaders who argued that the state takeover, while producing some academic gains, had
    removed Black community voice from governance of a majority-Black school system. The Orleans Parish
    School Board approved the unification transition plan in August 2016, beginning an 18-month implementation
    phase with quarterly milestones and an advisory committee. The legislation specifically prohibited
    OPSB from impeding charter school operational autonomy, reflecting the political compromise required
    for passage.

    '
  sources:
  - url: https://www.nola.com/news/education/2019-is-d-day-new-orleans-school-reunification-bill-advances/article_54c92e26-a8a3-5fb9-a015-e738891ebeb0.html
