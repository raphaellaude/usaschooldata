- event_id: CA-06246000-intervention-200306-oakland-state-takeover-fiscal-crisis
  district: Oakland Unified School District
  state: CA
  leaid: '06246000'
  event_type: intervention
  date: 2003-06
  title: California Takes Over Oakland Unified After $82M Deficit
  schools_affected:
  - name: All OUSD schools (district-wide governance change)
  description: 'In 2003, the State of California took control of Oakland Unified School District after
    the district accumulated an $82 million deficit. The state provided a $100 million emergency loan
    and installed a state administrator, removing the elected school board''s governing authority. The
    takeover lasted until 2009, during which time the state administrator oversaw budget cuts, school
    closures, and the expansion of charter schools in Oakland. The experience shaped OUSD''s subsequent
    facility decisions for years, including the 2012 closures and later rounds. The district''s financial
    struggles, combined with rapid charter school growth, created ongoing tension over facilities, enrollment,
    and the equitable distribution of resources between traditional public schools and charters — a dynamic
    that persists to this day.

    '
