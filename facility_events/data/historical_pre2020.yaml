- event_id: MO-29292800-intervention-201408-kcps-hale-cook-reopening
  district: Kansas City Public Schools
  state: MO
  leaid: '29292800'
  event_type: expansion
  date: 2014-08
  title: KCPS Reopens Hale Cook Elementary Through Grassroots Community Effort
  schools_affected:
  - name: Hale Cook Elementary School
  description: 'In August 2014, Kansas City Public Schools reopened Hale Cook Elementary School at 7302
    Pennsylvania Ave. in the Brookside neighborhood, four years after it was mothballed during the 2010
    mass closures. The reopening was driven by the grassroots "Friends of Hale Cook" community organization,
    which mobilized neighborhood support to convince the district to reopen the school. Hale Cook launched
    with 108 students in pre-K through 2nd grade. The successful community-led reopening became a rare
    positive counterpoint to the wave of school closures occurring nationwide, demonstrating that engaged
    communities could reverse closure decisions and rebuild neighborhood schools.

    '
