- event_id: IL-17099300-closure-201305-cps-mass-closure-49-schools
  district: Chicago Public Schools
  state: IL
  leaid: '17099300'
  event_type: closure
  date: 2013-05
  title: CPS Closes 49 Schools in Largest Mass Closure in US History
  schools_affected:
  - name: Henson Elementary
  - name: Key Elementary
  - name: Manierre Elementary
  - name: Altgeld Elementary
  - name: Garvey Elementary
  - name: Lafayette Elementary
  - name: Woods Elementary
  - name: Kozminski Elementary
  - name: Reavis Elementary
  - name: Delano Elementary
  - name: Von Humboldt Elementary
  - name: Dewey Elementary
  - name: Dett Elementary
  - name: West Pullman Elementary
  - name: 44 additional elementary schools (49 total)
  description: 'On May 22, 2013, the Chicago Board of Education voted unanimously to close 49 schools
    — 47 elementary schools, one high school program, and two schools phased out the following year —
    in the largest mass school closure in United States history. Approximately 12,000-17,000 students
    were displaced. CEO Barbara Byrd-Bennett and Mayor Rahm Emanuel cited a $1 billion deficit and severe
    underenrollment (space for 500,000 students with only 400,000 enrolled) as justification. CPS projected
    savings of $560 million in capital costs and $43 million annually in operations. Nearly all closed
    schools served predominantly African American communities on the South and West sides of Chicago.
    A UIC study found that schools with larger shares of African American students had a higher probability
    of closure even after controlling for test scores, location, and utilization rates. A 2018 University
    of Chicago Consortium study found academic outcomes were "neutral at best, and negative in some instances."
    As of 2023, more than half of the closed school buildings remain unused.

    '
  sources:
  - url: https://www.chicagotribune.com/news/ct-xpm-2013-05-23-chi-chicago-school-closings-20130522-story.html
  - url: https://www.npr.org/2023/06/01/1178727834/after-10-years-chicago-school-closings-have-left-big-holes-and-promises-unkept
  - url: https://www.chalkbeat.org/chicago/2023/7/25/23806124/chicago-school-closings-2013-henson-elementary/
  - url: https://graphics.suntimes.com/education/2023/chicagos-50-closed-schools/
  - url: https://news.wttw.com/2018/05/22/new-study-examines-long-term-impacts-2013-cps-closures
  causes:
