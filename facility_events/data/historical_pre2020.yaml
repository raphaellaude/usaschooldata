- event_id: WI-55096000-closure-201706-milwaukee-facilities-master-plan-study
  district: Milwaukee Public Schools
  state: WI
  leaid: '55096000'
  event_type: closure
  date: 2017-06
  title: MPS Commissions Long-Range Facilities Master Plan Study
  schools_affected:
  - name: District-wide assessment of 149 school buildings
  description: 'In 2017, Milwaukee Public Schools hired MGT of America Consulting to create a long-term
    facilities master plan, acknowledging the growing crisis of aging infrastructure and declining enrollment.
    MPS buildings averaged over 80 years old, with only 21 schools built after 1970. The district had
    reduced from 178 schools in 2008 to 149 but still had approximately one quarter of schools underutilized
    and another quarter overcrowded. Enrollment had dropped by 30,000 students since 2006, driven significantly
    by Wisconsin''s voucher program and charter school expansion. The study set the stage for eventual
    recommendations to close or merge 13 additional schools, though those recommendations would not be
    acted upon until 2024. The delay between study and action reflected the political difficulty of closing
    schools in predominantly low-income, minority communities.

    '
