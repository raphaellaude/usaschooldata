- event_id: PA-42002000-closure-201209-pittsburgh-7-school-consolidations
  district: Pittsburgh Public Schools
  state: PA
  leaid: '42002000'
  event_type: closure
  date: 2012-09
  title: Pittsburgh Consolidates Seven Schools Under Realignment Plan
  schools_affected:
  - name: Schaeffer Intermediate (Sheraden)
  - name: Schaeffer Primary (Crafton Heights)
  - name: Thaddeus Stevens K-8 (Elliott)
  - name: Langley High School (converted to K-8)
  - name: 3 additional schools (7 total)
  description: 'Under the 2011 Realignment Plan, Pittsburgh Public Schools closed seven schools at the
    start of the 2012-13 school year. Three of the closures hit the West Side hard, with schools in Sheraden,
    Crafton Heights, and Elliott shuttered. Most students from those schools were relocated to a newly
    reconfigured Langley K-8, which had previously been Langley High School. The plan eliminated nearly
    400 full-time positions and reduced staff salaries by $17.5 million. Superintendent Linda Lane, who
    oversaw the closures, later reflected: "I regret having had to do it, but there wasn''t another option
    given the district''s continued enrollment loss and subsequent financial hardship." The district had
    building capacity for 40,000 students but only 18,000 enrolled. Many closed buildings were subsequently
    sold or demolished — Schaeffer Primary, for instance, became a wholesale spice and seasoning store.

    '
