  - name: 17 schools in Year 2
  - name: 28 total school buildings renovated or replaced
  description: 'In 2013, the Maryland legislature passed H.B. 860, the Baltimore City Public Schools Construction
    and Revitalization Act, creating a groundbreaking partnership between Baltimore City Public Schools,
    the Maryland Stadium Authority, Baltimore City, and the State of Maryland. The act authorized the
    Stadium Authority to issue up to $1.1 billion in revenue bonds, supplemented by annual contributions
    of $20 million each from city schools, the state, and the city ($60 million total per year). The 10-year
    program renovated or replaced 28-29 schools — approximately one-fifth of the district''s inventory.
    Baltimore''s school buildings were among the oldest in Maryland, many lacking adequate heating/cooling,
    lighting, potable water, or technology infrastructure. The program was paired with INSPIRE (Investing
    in Neighborhoods and Schools to Promote Improvement, Revitalization, and Excellence), which planned
    neighborhood improvements within a quarter-mile of each school. The ACLU was instrumental in lobbying
    for the legislation after being appalled by school building conditions.

    '
