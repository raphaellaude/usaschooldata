- event_id: PA-42189900-intervention-201706-philadelphia-src-dissolved
  district: School District of Philadelphia
  state: PA
  leaid: '42189900'
  event_type: intervention
  date: 2017-06
  title: Philadelphia School Reform Commission Votes to Dissolve Itself
  schools_affected:
  - name: All Philadelphia public schools (district-wide governance change)
  description: 'In November 2017, the School Reform Commission (SRC) — the state-appointed body that had
    governed Philadelphia schools since 2001 — voted to dissolve itself and return control to a locally
    elected school board. The SRC had overseen 16 years of state control during which it managed the 2013
    mass closures, a catastrophic budget crisis, and contentious labor disputes. The dissolution, effective
    June 30, 2018, restored democratic governance and local control over the nation''s eighth-largest
    school district. Mayor Jim Kenney and Superintendent Hite supported the transition. The move was seen
    as a repudiation of the state takeover model and an acknowledgment that appointed governance had not
    solved the district''s fundamental funding challenges.

    '
