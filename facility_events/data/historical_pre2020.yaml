- event_id: GA-13003300-intervention-201504-atlanta-cheating-convictions
  district: Atlanta Public Schools
  state: GA
  leaid: '13003300'
  event_type: intervention
  date: 2015-04
  title: 11 Atlanta Educators Convicted on RICO Charges in Cheating Scandal
  schools_affected:
  - name: District-wide impact on accountability and governance
  description: 'On April 1, 2015, after the longest criminal trial in Georgia history (8 months, beginning
    September 29, 2014), 11 of 12 remaining defendants were convicted on racketeering charges under Georgia''s
    RICO Act. The convicted educators included three executive administrators, one principal, one assistant
    principal, four teachers, and two testing coordinators. Lead prosecutor Fani Willis secured the convictions.
    The trial revealed systematic cheating including "cheating parties," classroom erasure sessions, and
    directives from administrators to alter student test answers. The convictions cemented the Atlanta
    cheating scandal as the largest standardized test cheating case in American history. Under new Superintendent
    Maria Carstarphen, APS implemented comprehensive ethics training, replaced leadership at affected
    schools, and undertook a "child-centered agenda" to rebuild public trust. The scandal revealed how
    high-stakes testing accountability pressures, including the threat of school closures for poor performance,
    could incentivize widespread fraud.

    '
  sources:
  - url: https://www.cnn.com/2015/04/01/us/atlanta-schools-cheating-scandal/index.html
