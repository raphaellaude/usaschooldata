- event_id: MI-26054300-closure-201106-detroit-15-schools-transferred-eaa
  district: Detroit Public Schools
  state: MI
  leaid: '26054300'
  event_type: intervention
  date: 2012-06
  title: Michigan Creates Education Achievement Authority - Takes Over 15 DPS Schools
  schools_affected:
  - name: 15 lowest-performing Detroit schools transferred to state EAA
  description: 'As part of Emergency Manager Roy Roberts'' 2012 restructuring of Detroit Public Schools,
    15 of the district''s lowest-performing schools were transferred to the newly created Education Achievement
    Authority (EAA), a statewide district designed to turn around failing schools. The EAA was jointly
    governed by the state and Eastern Michigan University. The transferred schools were placed under separate
    administration with new curricula and technology-focused learning models. However, the EAA was widely
    criticized for poor outcomes, with test scores remaining among the lowest in the state. The EAA was
    eventually dissolved and its schools returned to Detroit Public Schools Community District control.
    The experiment was seen as a cautionary tale about state-run turnaround districts that removed schools
    from local democratic governance.

    '
