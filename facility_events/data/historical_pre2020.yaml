  - name: 29 high schools targeted for improvements
  description: 'On November 6, 2012, Houston ISD voters approved a $1.89 billion bond by approximately
    two-thirds support — the largest school bond in Texas history at the time. The measure focused largely
    on the district''s high schools, funding rebuilding, renovation, and upgrades across 38 campuses.
    It also included $100 million for technology upgrades, $44.7 million for athletics facilities, $35
    million for middle school restroom renovations, and $17.3 million for safety and security. The bond
    proposed a nearly 5-cent tax rate increase over five years. However, in 2015, the school board added
    $212 million to cover unexpected cost overruns, which two separate audits attributed partly to poor
    oversight of the construction bidding process. The HISD chief auditor suspected criminal violations
    and was fired after reporting them to law enforcement, leading to a lawsuit and settlement. The 2012
    bond''s focus on high schools left elementary campuses in the greatest need of maintenance for a subsequent
    bond.

