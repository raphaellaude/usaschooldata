  schools_affected:
  - name: 4 schools closed after 2012-13 school year (immediate)
  - name: 13 additional schools over the following 5 years
  - name: 26 total schools committed to surplus
  description: 'On November 27, 2012, Baltimore City Schools CEO Andres Alonso announced a 10-Year Plan
    to close 26 schools with declining enrollment or poor conditions. Four elementary/middle schools closed
    after the 2012-13 school year, with 13 more scheduled over the next five years. The closures were
    a required counterpart to the 21st Century Schools investment — new construction funding was conditioned
    on the district surplussing underutilized buildings (those with enrollment below 85% capacity). Baltimore''s
    total school enrollment had plummeted from a 1960s peak of 200,000 to about 81,000. As of recent reports,
    only four of the 30 shuttered buildings had been sold and converted to new uses, with nine more in
    the process of being sold. The remaining vacant buildings have been vulnerable to vandalism, copper
    theft, and deterioration, with the city''s general services department responsible for maintaining
    approximately 20 former school buildings.

    '
