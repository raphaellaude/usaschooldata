- event_id: MI-26054300-closure-201202-detroit-mass-closure-32-schools
  district: Detroit Public Schools
  state: MI
  leaid: '26054300'
  event_type: closure
  date: 2012-02
  title: Detroit Emergency Manager Closes 32 Schools Amid Fiscal Crisis
  schools_affected:
  - name: Campbell Elementary School
  - name: Crary Elementary School
  - name: Fleming Elementary School
  - name: Fitzgerald Elementary School
  - name: Hancock Elementary School
  - name: Mason Elementary School
  - name: McColl Elementary School
  - name: McKenny Elementary School
  - name: Owen Academy
  - name: George E. Parker Elementary School
  - name: William Robinson Elementary/Middle School
  - name: Van Zile Elementary School
  - name: 20 additional schools (32 total)
  description: 'Under state-appointed Emergency Manager Roy Roberts, Detroit Public Schools closed 32
    schools in 2012, up from 17 the year prior. The district had a $327 million deficit and had lost more
    than 100,000 students since 2000, falling below 50,000 enrolled students. Roberts, a former General
    Motors executive appointed by Governor Rick Snyder in 2011, also converted four schools to charters
    and shifted 15 others to the state''s Education Achievement Authority for the lowest-performing schools.
    Nine schools were closed outright with an estimated $7.5 million in annual operating savings. The
    district''s enrollment collapse was driven by deindustrialization, population loss, budget cuts, and
    rapid charter school expansion — by 2013, charter enrollment in Detroit exceeded DPS enrollment for
    the first time.

    '
  sources:
