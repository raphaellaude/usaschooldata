  - name: 9 renovation projects
  - name: 11 total Year 1 schools
  description: 'Construction began on Year 1 of the Baltimore 21st Century Schools Buildings Program,
    with 11 schools receiving major work — 2 complete replacements and 9 comprehensive renovations. The
    nearly $1 billion program, a partnership between Baltimore City Public Schools, the Maryland Stadium
    Authority, Baltimore City, and the State of Maryland, represented the most significant investment
    in Baltimore school infrastructure in decades. Each school project was paired with an INSPIRE neighborhood
    improvement plan covering a quarter-mile radius around the school. The Year 2 Request for Qualification
    process for 17 additional schools began in late Fall 2015. The program aimed to be substantially completed
    by 2021, ultimately delivering 29 renovated or replaced school buildings.

    '
