- event_id: MO-29292800-closure-201006-kcps-29-school-closures-rightsizing
  district: Kansas City Public Schools
  state: MO
  leaid: '29292800'
  event_type: closure
  date: 2010-06
  title: KCPS Closes 29 of 61 Schools to Avoid Bankruptcy
  schools_affected:
  - name: 29 school buildings closed (half of district's 61 schools)
  description: 'In 2010, Kansas City Public Schools made national headlines when Superintendent John Covington
    submitted a plan to close 29 of the district''s 61 remaining schools and lay off hundreds of teachers
    to avoid bankruptcy. KCPS had fewer than 18,000 students — half its enrollment in 2000 and 25% of
    its 1960s peak. The district had not passed a bond measure since 1967, making it the only Missouri
    school district in the region without voter-approved construction funding. In the aftermath, 17 sites
    were sold while others were repurposed or abandoned. The district hired urban planner Shannon Jaax
    in 2011 to oversee repurposing of the closed buildings, prioritizing community engagement and giving
    nonprofits access to purchase properties. KCPS lost its state accreditation in 2011 before regaining
    partial accreditation in 2014. In 2014, the district reopened Hale Cook Elementary through a grassroots
    community effort, launching with 108 students.

    '
  sources:
  - url: https://www.kcur.org/history/2025-03-27/kansas-city-public-schools-history-building-bond-desegregation-racism
