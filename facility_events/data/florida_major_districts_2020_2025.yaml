- event_id: FL-12001800-bond-201411-broward-county-public-schools
  district: Broward County Public Schools
  state: FL
  leaid: '12001800'
  event_type: bond
  date: 2014-11
  schools_affected:
  - name: All BCPS schools (district-wide)
  description: Broward County voters approved an $800 million SMART Bond referendum (Safety, Music, Art,
    Athletics, Renovations, Technology) with 74% approval. Combined with $184 million in existing capital,
    the total program reached $984 million. The program addressed up to $3 billion in deferred maintenance
    including roofing, HVAC, fire systems, ADA compliance, and STEM labs. Program was plagued by mismanagement;
    a 2021 grand jury report led to Gov. DeSantis removing four board members in 2022. Program officially
    ended Oct 31, 2025, though 100+ projects continue as capital projects.
