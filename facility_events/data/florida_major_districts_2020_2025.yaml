  date: 2024-08
  schools_affected:
  - name: Broward Estates Elementary (Lauderhill)
  description: Phase 1 of the "Redefining Our Schools" initiative closed Broward Estates Elementary, repurposing
    it as an early learning center. The district also converted four elementary schools into K-8 schools
    and one middle school into a 6-12 school. This was the first phase of a multi-year plan to address
    50,000 empty seats across 300 schools.
