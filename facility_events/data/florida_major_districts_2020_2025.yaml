# Florida Major School District Facility Events (2020-2025)
# Researched: 2026-02-08
# Focus: Miami-Dade, Broward, Hillsborough, Polk, Palm Beach, Duval, Osceola, Pinellas, Lee, Seminole

events:

  # ============================================================
  # MIAMI-DADE COUNTY PUBLIC SCHOOLS (335k students, lost 12k+)
  # ============================================================

  - district: "Miami-Dade County Public Schools"
    event_type: "closure"
    date: "2024-04"
    schools_affected:
      - "Parkview Elementary"
      - "Shadowlawn Elementary"
      - "Myrtle Grove K-8 Center (reconfigured to K-5)"
    description: >
      Miami-Dade repurposed three schools for the 2024-25 school year due to
      declining enrollment. Parkview Elementary was converted to a specialized
      exceptional student education (ESE) center. Shadowlawn Elementary became
      an ESE center. Myrtle Grove K-8 was reconfigured to a K-5 elementary,
      moving 6th-8th graders to Carol City Middle. About 250 students affected.
    source: "https://www.axios.com/local/miami/2024/04/24/miami-dade-schools-changes"

  - district: "Miami-Dade County Public Schools"
    event_type: "closure"
    date: "2025-02"
    schools_affected:
      - "Poinciana Park Elementary"
      - "Country Club Middle"
    description: >
      Miami-Dade proposed repurposing Poinciana Park Elementary (168 students,
      enrollment down 45% over five years) and Country Club Middle for the
      2025-26 school year. Seven schools in the north region and four in the
      central region also had boundary changes proposed.
    source: "https://www.axios.com/local/miami/2025/02/12/miami-schools-declining-enrollment-building-changes"

  - district: "Miami-Dade County Public Schools"
    event_type: "redistricting"
    date: "2025-02"
    schools_affected:
      - "11 schools across north and central regions"
    description: >
      Miami-Dade proposed boundary changes to 11 schools for the 2025-26 school
      year. The majority of proposals pertained to declining enrollment as private
      alternatives and the state voucher program continued to draw students away.
      The district projected a loss of about 4,000 students for 2024-25.
    source: "https://www.wlrn.org/news-in-brief/2025-02-13/mdcps-school-boundaries"

  - district: "Miami-Dade County Public Schools"
    event_type: "renovation"
    date: "2025-05"
    schools_affected:
      - "Multiple underused school sites"
    description: >
      The Miami-Dade school board began considering transforming underused school
      sites into early learning centers. The initiative aims to leverage existing
      infrastructure to promote fiscal responsibility while addressing the
      enrollment decline (13,000 fewer students year-over-year by Aug 2025,
      from 326k to 313k).
    source: "https://www.wlrn.org/news-in-brief/2025-05-15/miami-dade-schools-early-learning-initiative-enrollment"

  # ============================================================
  # BROWARD COUNTY PUBLIC SCHOOLS (251k students, lost 18k+)
  # ============================================================

  - district: "Broward County Public Schools"
    event_type: "bond"
    date: "2014-11"
    schools_affected:
      - "All BCPS schools (district-wide)"
    description: >
      Broward County voters approved an $800 million SMART Bond referendum
      (Safety, Music, Art, Athletics, Renovations, Technology) with 74% approval.
      Combined with $184 million in existing capital, the total program reached
      $984 million. The program addressed up to $3 billion in deferred maintenance
      including roofing, HVAC, fire systems, ADA compliance, and STEM labs.
      Program was plagued by mismanagement; a 2021 grand jury report led to
      Gov. DeSantis removing four board members in 2022. Program officially
      ended Oct 31, 2025, though 100+ projects continue as capital projects.
    source: "https://bcpssmartfutures.com/about/"

  - district: "Broward County Public Schools"
    event_type: "renovation"
    date: "2020-10"
    schools_affected:
      - "Marjory Stoneman Douglas High School"
    description: >
      An $18 million replacement classroom building opened on the southwest side
      of the MSD campus, replacing the freshman building where the 2018 mass
      shooting occurred. The two-story, 45,000 sq ft building replaced the
      original three-story structure. Students had been learning in portables
      during construction.
    source: "https://sun-sentinel.com/news/education/fl-ne-stoneman-douglas-building-update-20200116-rvhfndneindxjn5ce3uoa6sdp4-story.html"

  - district: "Broward County Public Schools"
    event_type: "renovation"
    date: "2024-06"
    schools_affected:
      - "Marjory Stoneman Douglas High School (1200 Building)"
    description: >
      Demolition of the original building where the 2018 Parkland shooting
      occurred began on June 14, 2024, and was completed by July 5. The building
      had been preserved as a crime scene through the trial. Future plans for
      the site include a possible "legacy field" for sports or band practice.
    source: "https://en.wikipedia.org/wiki/Parkland_high_school_shooting"

  - district: "Broward County Public Schools"
    event_type: "closure"
    date: "2024-08"
    schools_affected:
      - "Broward Estates Elementary (Lauderhill)"
    description: >
      Phase 1 of the "Redefining Our Schools" initiative closed Broward Estates
      Elementary, repurposing it as an early learning center. The district also
      converted four elementary schools into K-8 schools and one middle school
      into a 6-12 school. This was the first phase of a multi-year plan to
      address 50,000 empty seats across 300 schools.
    source: "https://www.wlrn.org/education/2024-02-09/broward-public-school-closures-consolidation-low-enrollment"

  - district: "Broward County Public Schools"
    event_type: "closure"
    date: "2026-01"
    schools_affected:
      - "Sunshine Elementary (Miramar)"
      - "Panther Run Elementary (Pembroke Pines)"
      - "Palm Cove Elementary (Pembroke Pines)"
      - "North Fork Elementary (Fort Lauderdale)"
      - "Plantation Middle School"
      - "Seagull Alternative High School (Fort Lauderdale)"
    description: >
      Phase 2 of "Redefining Our Schools" closed six schools. The board voted
      Jan 21-22, 2026. Sunshine Elementary consolidated into Fairway Elementary.
      Panther Run students sent to Chapel Trail and Silver Palms. Palm Cove
      students to Lakeside and Pines Lakes. North Fork consolidated into
      Croissant Park, MLK Jr., Thurgood Marshall, and Walker elementaries.
      Plantation Middle merged into Plantation High (becoming 6-12). Seagull
      consolidated into Whiddon-Rogers. Bair Middle was spared after community
      advocacy. Estimated savings: $10 million annually. Superintendent said
      they are "halfway there" to $100 million savings target.
    source: "https://www.wlrn.org/education/2026-01-23/broward-county-schools-closures-hepburn-redefining"

  - district: "Broward County Public Schools"
    event_type: "redistricting"
    date: "2026-01"
    schools_affected:
      - "Multiple schools across Broward County"
    description: >
      Alongside Phase 2 closures, the Broward school board approved boundary
      changes to redistribute students from closed and consolidated schools.
      The district identified 68 schools operating at less than 70% capacity.
      Changes take effect for the 2026-27 school year.
    source: "https://www.wlrn.org/education/2026-01-22/broward-school-closures-boundary-changes-redefining"

  # ============================================================
  # HILLSBOROUGH COUNTY PUBLIC SCHOOLS (224k students, Tampa)
  # ============================================================

  - district: "Hillsborough County Public Schools"
    event_type: "closure"
    date: "2023-05"
    schools_affected:
      - "Just Elementary"
      - "Cleveland Elementary"
      - "Adams Elementary"
      - "McLane Middle"
      - "Monroe Middle"
      - "Kimbell Elementary"
    description: >
      Hillsborough closed six schools - the first closures due to low enrollment
      in the district's 140-year history. 24% of schools were overcrowded while
      44% were under-enrolled. Kimbell became HOST (after-school care) HQ;
      McLane became an ESE office; Monroe is used for storage. Just Elementary
      closure was controversial as the school was 82% Black.
    source: "https://www.wusf.org/education/2024-05-28/five-hillsborough-schools-have-closed-a-parent-mourns-the-loss-of-her-daughters-elementary"

  - district: "Hillsborough County Public Schools"
    event_type: "redistricting"
    date: "2023-06"
    schools_affected:
      - "103 schools with boundary changes"
      - "6 schools repurposed"
      - "3 schools partially repurposed"
    description: >
      The school board voted 4-3 to approve massive boundary redesign for the
      2024-25 school year. The plan impacts roughly 15,000 students (down from
      an initial proposal affecting 24,000). Boundaries for 103 schools were
      redrawn. The district hired WXY Studio to review boundaries and address
      the imbalance of overcrowded and under-enrolled schools. Estimated savings
      of $13 million.
    source: "https://www.wusf.org/education/2023-06-21/hillsborough-county-school-board-votes-to-approve-boundary-changes-in-a-4-3-vote"

  - district: "Hillsborough County Public Schools"
    event_type: "expansion"
    date: "2024-02"
    schools_affected:
      - "Just Elementary (rebuild)"
      - "Stewart Middle Magnet (rebuild)"
    description: >
      Hillsborough announced plans to rebuild Just Elementary and Stewart Middle
      Magnet as a combined campus project in west Tampa - the first new schools
      built in Tampa's urban core in 30 years. Just will accommodate 500 students
      and Stewart 800. Cost estimated at $70 million (with some estimates reaching
      higher). Just Elementary is scheduled to reopen August 2027.
    source: "https://www.tampabay.com/news/education/2024/02/29/tampas-just-elementary-stewart-middle-will-be-rebuilt-officials-say/"

  - district: "Hillsborough County Public Schools"
    event_type: "expansion"
    date: "2025-11"
    schools_affected:
      - "Just Elementary (replacement campus)"
      - "Stewart Middle School (replacement campus)"
      - "New South County middle school"
    description: >
      The school board approved nearly $150 million in new construction including
      replacement campuses for Just/Stewart in Tampa and a new middle school in
      the South County area. The vote occurred amid concerns about Florida's
      expanded Schools of Hope program, which could allow charter schools to
      claim unused space in new buildings that haven't yet reached full enrollment.
    source: "https://www.wusf.org/education/2025-11-19/hillsborough-build-two-new-schools-threat-charter-takeover"

  - district: "Hillsborough County Public Schools"
    event_type: "bond"
    date: "2024-11"
    schools_affected:
      - "All Hillsborough County schools"
    description: >
      Hillsborough County voters approved a new millage for school operations
      (Referendum 2) with 66.55% of the vote in November 2024. This provides
      additional funding for school facilities and operations.
    source: "https://feaweb.org/release/election-release/"

  # ============================================================
  # POLK COUNTY PUBLIC SCHOOLS (208k students, grew by 18 schools)
  # ============================================================

  - district: "Polk County Public Schools"
    event_type: "bond"
    date: "2018-11"
    schools_affected:
      - "All Polk County schools"
    description: >
      Polk County voters approved a 15-year renewal of the half-cent sales tax
      for schools (through Dec 2034). Originally approved in 2003, the tax funds
      capital projects including new construction, modernization, security, and
      technology. The tax generates critical revenue for the 7th largest district
      in Florida (also the 4th lowest funded). A 21-member oversight committee
      monitors spending.
    source: "https://www.polkschoolsfl.com/community/salestax"

  - district: "Polk County Public Schools"
    event_type: "expansion"
    date: "2023-07"
    schools_affected:
      - "Scenic Terrace K-8 (new)"
      - "Elbert Elementary (modernization)"
    description: >
      A public-private partnership delivered the brand-new Scenic Terrace school
      in Haines City in just 9 months, on time and on budget. The 157,000 sq ft
      facility has capacity for 1,600 students. Initially it served as a
      temporary home for Elbert Elementary students while that school undergoes
      complete modernization. Scenic Terrace will then become a permanent K-8
      school to serve the rapidly growing district.
    source: "https://www.pr.com/press-release/893445"

  - district: "Polk County Public Schools"
    event_type: "expansion"
    date: "2024-01"
    schools_affected:
      - "Lake Region High School (agriculture facility)"
      - "McLaughlin Academy of Excellence (new gymnasium)"
    description: >
      Lake Region High School opened a new 2,145 sq ft agriculture facility
      for ag studies, located near the school's exterior ag area. McLaughlin
      Academy of Excellence also cut the ribbon on a new gymnasium. Both
      projects were funded through the half-cent sales tax.
    source: "https://www.polkschoolsfl.com/news"

  # ============================================================
  # PALM BEACH COUNTY SCHOOL DISTRICT (188k students, lost 8k)
  # ============================================================

  - district: "Palm Beach County School District"
    event_type: "expansion"
    date: "2025-08"
    schools_affected:
      - "Saddle View Elementary (new)"
    description: >
      Saddle View Elementary opened Aug 11, 2025, with 631 students in a $41.7
      million, 95,990 sq ft facility designed for 971 students. Built to relieve
      overcrowding at Binks Forest Elementary in the rapidly growing Arden
      community west of Wellington. Features indoor-outdoor agriculture lab with
      hydroponic gardens. Opened two years ahead of the original schedule due to
      rapid growth in western communities.
    source: "https://gotowncrier.com/2025/08/saddle-view-elementary-opens-to-600-plus-students/"

  - district: "Palm Beach County School District"
    event_type: "expansion"
    date: "2027-08"
    schools_affected:
      - "New elementary school (Westlake area)"
    description: >
      Palm Beach County is planning a new elementary school estimated at $42.9
      million to open in August 2027 in the City of Westlake, which was founded
      in 2016 and had a population approaching 7,000 by 2024. Saddle View is one
      of three new schools planned for the western part of the county in the next
      five years.
    source: "https://www.yahoo.com/news/articles/another-elementary-school-moves-ahead-090727822.html"

  - district: "Palm Beach County School District"
    event_type: "redistricting"
    date: "2025-10"
    schools_affected:
      - "120+ teachers reassigned"
      - "67 schools operating below 70% capacity"
    description: >
      Declining enrollment forced at least 120 teacher reassignments and
      threatened $25 million in state funding cuts. Analysis found 67 schools
      (nearly one-third of the district) operating below 70% capacity. Hardest
      hit included Indian Pines Elementary (39% full) and Benoist Farms
      Elementary (41% full). The district explicitly stated it is NOT pursuing
      closures or consolidations at this time, distinguishing itself from
      neighboring Broward and Miami-Dade.
    source: "https://www.wlrn.org/news-in-brief/2025-10-14/declining-enrollment-forces-teacher-reassignments-in-palm-beach-county"

  # ============================================================
  # DUVAL COUNTY PUBLIC SCHOOLS (127k students, Jacksonville)
  # ============================================================

  - district: "Duval County Public Schools"
    event_type: "bond"
    date: "2020-11"
    schools_affected:
      - "150+ campuses district-wide"
    description: >
      Duval County voters overwhelmingly approved (67%) a half-penny sales tax
      to fund $1.9 billion in school repairs and new construction over 15 years.
      Duval schools are on average the oldest in the state. The tax funds the
      Master Facility Plan covering renovations, rebuilds, safety/security
      upgrades, and new construction. Revenue exceeded projections but inflation
      offset gains. By Nov 2021, revenue reached $92.27 million.
    source: "https://www.teamduval.org/2020/12/14/half-cent-sales-tax-passed-now-what/"

  - district: "Duval County Public Schools"
    event_type: "expansion"
    date: "2022-11"
    schools_affected:
      - "Rutledge Pearson Elementary (new, $28M)"
      - "Jean Ribault High School (rebuild)"
      - "Chaffee Trail Middle (rebuild)"
      - "Highland Elementary (rebuild)"
      - "Southside Estates Elementary (rebuild)"
    description: >
      Multiple new school buildings began emerging from the half-penny funded
      Master Facility Plan. Rutledge Pearson consolidates three schools into
      one new $28M facility. Jean Ribault High School rebuild (first new high
      school building since Atlantic Coast opened in 2010) began construction
      Sept 2023 with anticipated occupancy Aug 2025. Safety and security
      upgrades in progress at 42 schools.
    source: "https://www.teamduval.org/2022/11/14/new-schools-emerging-throughout-jacksonville-thanks-to-half-penny/"

  - district: "Duval County Public Schools"
    event_type: "closure"
    date: "2024-10"
    schools_affected:
      - "18 schools planned for closure over 5 years"
      - "6 new schools to be built"
    description: >
      The school board approved (6-1) a five-year plan suggesting closure of
      18 schools and construction of six new ones. The plan addresses a $1.4
      billion budget gap caused by increased post-pandemic construction costs,
      revenue sharing with charter schools, and shrinking enrollment.
      Superintendent Bernier noted schools need about 700 students to cover
      operational costs; about a third of 96 elementary schools meet that
      threshold.
    source: "https://jaxtoday.org/2024/10/02/duval-plan-schools/"

  - district: "Duval County Public Schools"
    event_type: "closure"
    date: "2024-11"
    schools_affected:
      - "Annie R. Morgan Elementary (Westside)"
      - "Kings Trail Elementary (San Jose)"
      - "Susie E. Tolbert Elementary (NW Jacksonville)"
    description: >
      The board voted to close three elementary schools at the end of the
      2024-25 school year, consolidating students into neighboring schools.
      Consolidation of Don Brewer and Merrill Road elementaries was delayed
      after concerns about poor planning. The NAACP raised equity concerns
      given the district's history with desegregation.
    source: "https://jaxtoday.org/2024/11/05/3-duval-elementary-schools-will-close-soon-3-more-after-a-year/"

  - district: "Duval County Public Schools"
    event_type: "closure"
    date: "2025-06"
    schools_affected:
      - "Hyde Grove Elementary (into Hyde Park Elementary)"
      - "Long Branch Elementary (into R.L. Brown Elementary)"
      - "Anchor Academy (into Mayport or Atlantic Beach Elementary)"
      - "Joseph Stilwell Middle (into Ed White, becoming 6-12)"
    description: >
      Additional schools scheduled for closure/consolidation consideration in
      the second year of the 5-year Master Facility Plan. The district will
      provide transportation for students whose new school is more than 1.5
      miles from home and may establish bus stops at closed school sites.
    source: "https://jaxtoday.org/2024/09/24/duval-could-close-12-elementary-schools-within-5-years/"

  # ============================================================
  # OSCEOLA COUNTY SCHOOL DISTRICT (116k students, grew by 8k)
  # ============================================================

  - district: "Osceola County School District"
    event_type: "expansion"
    date: "2024-08"
    schools_affected:
      - "Knights Point K-8 (new)"
      - "Voyager K-8 (new)"
    description: >
      Osceola County opened two new K-8 schools in 2024, each accommodating
      about 1,400 students, to address rapid population growth (county grew 46%
      from 2010 to 2022). The district has over 73,000 students and projects
      exceeding 100,000 within 10 years. Construction spending increased from
      $30 million to approximately $1 billion over 3.5 years.
    source: "https://www.wesh.com/article/new-schools-osceola-county/46996652"

  - district: "Osceola County School District"
    event_type: "renovation"
    date: "2024-03"
    schools_affected:
      - "78 projects across the district"
    description: >
      The school board detailed hundreds of millions in active projects: 5 in
      planning, 26 in design, 31 under construction, and 16 in closeout,
      totaling $919 million. Includes comprehensive renovation of the Osceola
      County School of the Arts. The district's chief facilities officer noted
      a dramatic increase from $30 million to nearly $1 billion in construction.
    source: "https://www.clickorlando.com/news/local/2024/03/26/renovations-new-schools-shape-osceola-countys-education-landscape/"

  - district: "Osceola County School District"
    event_type: "expansion"
    date: "2025-08"
    schools_affected:
      - "Kindred K-8 School (new, $75M)"
    description: >
      A $75 million K-8 school is being built along Cross Prairie Parkway in
      the new Kindred community of Kissimmee. The school was scheduled to open
      for the 2025-26 school year, adding capacity for approximately 1,400
      students in one of Florida's fastest-growing areas.
    source: "https://www.wesh.com/article/new-school-housing-osceola-county/44120999"

  - district: "Osceola County School District"
    event_type: "expansion"
    date: "2025-05"
    schools_affected:
      - "Reedy Creek Elementary (rebuild, $59M)"
    description: >
      Osceola County Schools broke ground on a $59 million rebuild of Reedy
      Creek Elementary, split into two phases. The project is part of the
      district's effort to manage explosive growth in the county.
    source: "https://mynews13.com/fl/orlando/news/2025/05/14/osceola-county-schools-breaks-ground-on--59-m--reedy-creek-rebuild-to-manage-county-growth"

  - district: "Osceola County School District"
    event_type: "expansion"
    date: "2026-08"
    schools_affected:
      - "New high school ($184M)"
    description: >
      A new high school with an $184 million construction budget funded through
      county impact fees will open for the 2026 school year. It will include 11
      permanent buildings for 2,522 students - the first high school built since
      Tohopekaliga High School opened in 2018.
    source: "https://www.clickorlando.com/news/local/2025/01/24/what-a-new-high-school-means-for-a-growing-osceola-county-school-district/"

  # ============================================================
  # PINELLAS COUNTY SCHOOLS (91k students, lost 9k)
  # ============================================================

  - district: "Pinellas County Schools"
    event_type: "closure"
    date: "2026-01"
    schools_affected:
      - "Cross Bayou Elementary (closure)"
      - "Disston Academy (closure)"
      - "Bay Point Elementary + Bay Point Middle (consolidation to K-8)"
      - "Oldsmar Elementary (expansion to K-8)"
    description: >
      Superintendent Kevin Hendrick recommended closing Cross Bayou Elementary
      and Disston Academy at the end of 2025-26, creating a K-8 school combining
      Bay Point Elementary and Bay Point Middle on the middle school campus in
      2027-28, and expanding Oldsmar Elementary to K-8 in 2026-27. The district
      has 35,000 more seats than students and about a third of campuses sit below
      60% capacity. Estimated savings: $8 million annually. A larger round of
      closures is expected next fall.
    source: "https://www.wfla.com/news/pinellas-county/pinellas-county-recommends-closure-of-2-schools-consolidation-due-to-low-enrollment/"

  # ============================================================
  # LEE COUNTY SCHOOL DISTRICT (98k students)
  # ============================================================

  - district: "Lee County School District"
    event_type: "renovation"
    date: "2022-09"
    schools_affected:
      - "Fort Myers Beach Elementary"
      - "Hector A. Cafferata Jr. Elementary"
      - "The Sanibel School"
      - "11 schools total with significant damage"
    description: >
      Hurricane Ian (Sept 2022) caused an estimated $230-$300 million in damage
      to Lee County schools. Fort Myers Beach Elementary (built 1947, on the
      National Register) and Cafferata Elementary suffered the worst damage.
      Cafferata's 715 students were split between two temporary locations. The
      Sanibel School also sustained major damage.
    source: "https://winknews.com/2023/10/02/rebuilding-schools-after-hurricane-ian/"

  - district: "Lee County School District"
    event_type: "bond"
    date: "2023-12"
    schools_affected:
      - "District-wide recovery projects"
    description: >
      The School District of Lee County received $51 million in Hurricane Ian
      recovery funds as part of a $338 million total award to Lee County agencies.
      This was the highest allocation to a single entity, tied only with the City
      of Cape Coral. The district also received a $55 million loan from Florida's
      Department of Emergency Management. HUD awarded Lee County $1.1 billion
      total for long-term recovery.
    source: "https://www.leeschools.net/news/october_2023/district_to_receive_51_million_for_ian_recovery"

  - district: "Lee County School District"
    event_type: "expansion"
    date: "2024-08"
    schools_affected:
      - "Hector A. Cafferata Jr. Elementary K-8 (new build)"
    description: >
      A brand-new Cafferata K-8 school was planned to open during the 2024-25
      school year on district-owned property in Cape Coral, replacing the
      original elementary school destroyed by Hurricane Ian. The new school
      expands to serve middle school grades as well.
    source: "https://www.wgcu.org/section/education/2023-08-09/new-and-rebuilt-schools-will-open-in-lee-county"

  - district: "Lee County School District"
    event_type: "renovation"
    date: "2024-10"
    schools_affected:
      - "Fort Myers Beach Elementary (closed again)"
    description: >
      Fort Myers Beach Elementary, which had been in recovery from Hurricane Ian,
      was closed again after Hurricanes Helene and Milton (Sept-Oct 2024) caused
      significant flood damage. Students were relocated to San Carlos Park
      Elementary. The district is now considering five repair/rebuild options
      ranging from $1.3M to $15.9M. FEMA awarded $11.4M for the school. A
      final decision on the school's future is expected June 2025.
    source: "https://www.wgcu.org/education/2025-05-28/fate-of-fort-myers-beach-elementary-school-discussed-by-town-school-board"

  # ============================================================
  # SEMINOLE COUNTY PUBLIC SCHOOLS (85k students, grew 10%)
  # ============================================================

  - district: "Seminole County Public Schools"
    event_type: "expansion"
    date: "2024-09"
    schools_affected:
      - "Lake Mary Elementary (replacement, $24M)"
    description: >
      Seminole County Public Schools announced plans to build a $24 million
      replacement of Lake Mary Elementary School at 132 S. Country Club Road,
      Lake Mary. The district sought a construction manager at risk for the
      project. Seminole County is the #1 rated public school district in
      Florida by Niche, with 94% of schools rated A or B.
    source: "https://www.wftv.com/news/local/seminole-county-district-plans-24-million-school-replacement/TVSIOUACEFFLRIOHZMCAPJLVFM/"

