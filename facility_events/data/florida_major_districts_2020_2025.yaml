  # CROSS-DISTRICT: Schools of Hope Law (statewide impact)
  # ============================================================

  - district: "Statewide (all Florida districts)"
    event_type: "redistricting"
    date: "2024-07"
    schools_affected:
      - "Hundreds of underenrolled schools across Florida"
    description: >
      Florida expanded the Schools of Hope law, allowing for-profit charter
      schools to claim classroom space in under-capacity public schools for
      free ("co-location"). Charter operator Mater Academy sent letters to
      ~90 public schools; Academica sent hundreds of letters. Districts
      including Hillsborough, Pinellas, Orange, and Duval flagged dozens of
      schools as vulnerable. This law is accelerating closure/consolidation
      decisions in many districts. Proposed rule changes in Feb 2026 would
      limit charters to schools below 75% capacity or with 400+ open seats.
