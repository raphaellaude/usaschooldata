- event_id: FL-12001800-closure-202601-broward-county-public-schools
  district: Broward County Public Schools
  state: FL
  leaid: '12001800'
  event_type: closure
  date: 2026-01
  schools_affected:
  - name: Sunshine Elementary (Miramar)
  - name: Panther Run Elementary (Pembroke Pines)
  - name: Palm Cove Elementary (Pembroke Pines)
  - name: North Fork Elementary (Fort Lauderdale)
  - name: Plantation Middle School
  - name: Seagull Alternative High School (Fort Lauderdale)
  description: 'Phase 2 of "Redefining Our Schools" closed six schools. The board voted Jan 21-22, 2026.
    Sunshine Elementary consolidated into Fairway Elementary. Panther Run students sent to Chapel Trail
    and Silver Palms. Palm Cove students to Lakeside and Pines Lakes. North Fork consolidated into Croissant
    Park, MLK Jr., Thurgood Marshall, and Walker elementaries. Plantation Middle merged into Plantation
    High (becoming 6-12). Seagull consolidated into Whiddon-Rogers. Bair Middle was spared after community
    advocacy. Estimated savings: $10 million annually. Superintendent said they are "halfway there" to
    $100 million savings target.'
  sources:
