  district: Frisco ISD
  state: TX
  leaid: '4828350'
  event_type: intervention
  date: 2024-11
  title: VATRE Rejected; District Shifts to Open Enrollment
  schools_affected:
  - name: District-wide (77 campuses)
  description: 'Frisco ISD voters rejected a Voter Approval Tax Rate Election (VATRE) with 57.45% voting
    against. The district faced a $30.8 million budget shortfall for 2024-25. In response, the district
    launched the "Access Frisco" program to open enrollment to K-7 students from surrounding areas in
    2025-26, seeking $750,000 in state funding per 100 additional students to compensate for plateauing
    local growth.

    '
