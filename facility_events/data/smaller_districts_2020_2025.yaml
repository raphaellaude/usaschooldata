  district: Cleveland Metropolitan School District
  state: OH
  leaid: '3904378'
  event_type: closure
  date: 2025-12
  title: Building Brighter Futures -- 29 Schools Merged, 18 Buildings Close
  schools_affected:
  - name: 29 schools merged (61 elementary to 45; 27 high schools to 14)
  - name: 18 school buildings closed entirely
  description: 'The CMSD Board unanimously approved the "Building Brighter Futures" consolidation plan
    to merge 39 schools, reducing by 29, and close 18 buildings. Enrollment dropped from 70,000 in 2004
    to 34,000 in 2024, with buildings at half or one-third capacity. The district faces a budget deficit
    by 2028 without change and needs to save $150 million. The plan saves $30 million/year and affects
    about 5,000 students for 2026-27. Ohio''s expanded voucher and charter programs contributed to enrollment
    losses.

    '
