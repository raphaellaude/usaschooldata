- event_id: GA-13017400-redistricting-202201-dekalb-county-school-district
  district: DeKalb County School District
  state: GA
  leaid: '13017400'
  event_type: redistricting
  date: 2022-01
  schools_affected:
  - name: District-wide (138 schools)
  description: DeKalb County unveiled a "reimagining" plan (student assignment planning) to serve as a
    roadmap for the next decade. The plan recommended redistricting throughout the county by 2030, consolidation
    of some elementary schools, creation of K-8 facilities in some areas, and rebuilding other schools
    with sales tax funds. The district declined from 100,000+ students in 2016 to about 92,000, leaving
    many buildings under-utilized. The process is expected to take 18 months to two years.
  sources:
