  district: Prince William County Public Schools
  state: VA
  leaid: '51022500'
  event_type: closure
  date: 2026-02
  schools_affected:
  - name: 14th High School (cancelled)
  description: Prince William County officially cancelled plans for its 14th high school, which had been
    delayed multiple times due to declining enrollment. PWCS data showed the county anticipates 1,030
    vacant seats across existing 13 high schools by 2029. The district projects a decrease of approximately
    3,776 students over the next five years. Northern Virginia experienced its first population decline
    since 1970, as residents move to Richmond and exurbs due to housing costs and remote work.
  sources:
  - url: https://northernvirginiamag.com/family/education/2026/02/06/prince-william-county-cancels-plans-for-new-high-school/
