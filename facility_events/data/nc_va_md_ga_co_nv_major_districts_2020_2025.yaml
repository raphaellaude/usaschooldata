  state: GA
  leaid: '13017400'
  event_type: redistricting
  date: 2025-02
  schools_affected:
  - name: Idlewood Elementary
  - name: Austin Elementary (new facility)
  - name: Dunwoody Cluster elementary schools
  description: The Board of Education approved redistricting for Idlewood Elementary on February 10, 2025.
    A separate redistricting process determined new attendance lines for a new Austin Elementary facility
