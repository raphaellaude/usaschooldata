- event_id: NC-37029700-bond-202311-charlotte-mecklenburg-schools
  district: Charlotte-Mecklenburg Schools
  state: NC
  leaid: '37029700'
  event_type: bond
  date: 2023-11
  schools_affected:
  - name: 30 bond projects across the district
  description: Mecklenburg County voters approved a historic $2.5 billion school bond, the largest school
    bond in North Carolina history. The bond covers 30 projects including new middle schools in Huntersville,
    south and southwest Charlotte; a new health-sciences magnet high school in uptown Charlotte; a new
    regional athletic facility in west Charlotte; and 25 renovation and replacement projects. Funded by
    a 3-cent property tax increase phased in during 2025, 2028, and 2029. As enrollment growth slows,
    the bond shifts focus from new construction to replacing existing aging schools.
  sources:
  - url: https://www.wfae.org/education/2023-10-31/heres-everything-you-need-to-know-about-the-2-5-billion-cms-bond-vote-on-nov-7
