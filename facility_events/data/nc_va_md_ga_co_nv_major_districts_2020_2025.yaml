  state: MD
  leaid: '24004800'
  event_type: bond
  date: 2025-11
  schools_affected:
  - name: 13 Major Capital Projects (4 HS, 2 MS, 7 ES)
  description: The Board of Education accepted a $2.78 billion Capital Improvements Program (FY 2027-2032)
    targeting aging buildings, critical systems, and infrastructure. Includes 13 Major Capital Projects
    (four high schools, two middle schools, seven elementary schools) for completion within six years,
    plus $521.4 million for HVAC/roof replacements and $303.8 million for other infrastructure renewal.
    County Executive Marc Elrich proposed $2.1 billion for MCPS in the county's $6.6 billion CIP -- a
    record allocation.
