  district: Wake County Public School System
  state: NC
  leaid: '37047200'
  event_type: expansion
  date: 2025-08
  schools_affected:
  - name: Bowling Road Elementary (Fuquay-Varina)
  - name: Pleasant Plains Elementary (Apex)
  - name: Rex Road Elementary (Holly Springs)
  - name: Felton Grove High School (Apex)
  description: Four new schools opened for the 2025-26 school year to address tremendous growth in Southern
    Wake County. Rex Road Elementary is a 133,000 sq ft campus designed for 800 K-5 students. The four
    new schools bring the district total to 203 schools serving 161,115+ students. The district forecasts
    growth to 170,000+ students over the next 10 years, with five more schools planned in that period.
    In 2021-22, 11% of teaching spaces were in 894 mobile/modular classrooms.
  sources:
  - url: https://abc11.com/post/wake-county-public-school-systems-is-opening-new-schools-tremendous-growth-southern/17394214/
