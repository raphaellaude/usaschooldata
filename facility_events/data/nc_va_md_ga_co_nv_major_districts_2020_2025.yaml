- event_id: NC-37047200-bond-202211-wake-county-public-school-syst
  district: Wake County Public School System
  state: NC
  leaid: '37047200'
  event_type: bond
  date: 2022-11
  schools_affected:
  - name: 5 new schools
  - name: 7 school renovations
  description: Wake County voters approved a $530.7 million school bond referendum on November 8, 2022,
    as part of over $1 billion in bond approvals. The bond funds construction of five new schools (elementary
    schools in Apex, Fuquay-Varina, and Wendell; a middle school in Morrisville; and a high school serving
    west Cary/Morrisville) plus major renovations at seven existing schools. Property tax impact was 1
    cent per $100 of assessed value. The bond supplements a 7-year building plan (FY 2023-2029) totaling
    $2.632 billion for 11 new schools and 10 major renovations.
  sources:
  - url: https://abc11.com/wake-county-election-results-bonds-parks/12434777/
  causes:
  - budget_fiscal
  - new_construction
  - political_governance
