  description: Jeffco began considering closing Jefferson Jr./Sr. High School (grades 7-12) and converting
    it into a specialized career-focused high school. A boundary study found the school unsustainable
    with projected enrollment of only 372 students by 2027-28 -- with 47% of boundary families already
    choosing other schools. The district frames it as a "transition" rather than closure, though board
