  district: Montgomery County Public Schools
  state: MD
  leaid: '24004800'
  event_type: renovation
  date: 2025-10
  schools_affected:
  - name: 162 school buildings over 25 years old
  - name: 40 HVAC systems not functioning properly
  description: MCPS unveiled its "Hard Truths About Our School Buildings" presentation, revealing that
    nearly two-thirds of its 238 school buildings (162 buildings) are more than 25 years old, with $740
    million in overdue projects including 40 non-functioning HVAC systems. The district needs $175 million
    to replace roofs older than 20 years. To reach long-term goals, MCPS would need to renovate 6-7 elementary
    schools and 3 middle/high schools every year for 20 years; currently averaging only 5 schools per
    year.
  sources:
  - url: https://mocoshow.com/2025/10/14/mcps-presentation-hard-truths-about-our-school-buildings-outlines-major-overhaul-of-school-facilities-plan/
  causes:
