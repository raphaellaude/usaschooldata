  - name: Sierra Middle School (expansion)
  - name: All schools (safety/security updates)
  description: Douglas County voters approved a $490 million bond (Ballot Issue 5A) with 59% support --
    after rejecting a bond request in 2023. The bond allocates $150 million for new school construction
    in RidgeGate and Sterling Ranch and expansion of Sierra Middle School; $178.9 million for capital
    renewal and replacement; and $38.2 million for career and technical education (CTE) programs. No property
    tax increase required -- the district will restructure debt to maintain the current 5.2 mill tax rate.
