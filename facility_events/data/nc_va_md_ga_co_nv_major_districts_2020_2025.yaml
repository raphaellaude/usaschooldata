  schools_affected:
  - name: Campfield Early Learning Center (Gwynn Oak)
  description: The Baltimore County Board of Education voted on March 11, 2025 to close Campfield Early
    Learning Center at the end of the current academic year, earlier than the originally planned 2025-26
    closure. With fewer than 60 students projected, officials determined students' needs could be better
