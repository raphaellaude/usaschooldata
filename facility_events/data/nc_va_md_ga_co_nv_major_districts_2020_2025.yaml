  - name: Silver Line Elementary (new)
  - name: Western High School (acquisition and renovation)
  description: The FY 2027-2031 CIP requires $1.1 billion over five years for renovation, maintenance,
    and construction. Plans include repurposing the Dunn Loring Administrative Center into a new elementary
