  state: MD
  leaid: '24004800'
  event_type: closure
  date: 2025-12
  schools_affected:
  - name: Silver Spring International Middle School (proposed closure 2030)
  description: The MCPS superintendent proposed closing the 90-year-old Silver Spring International Middle
    School in 2030 and converting it to a holding school. In December 2025, the school board suspended
    consideration of the closure, choosing to incorporate the decision into a future holistic study of
    elementary school boundaries. Enrollment has dropped to a 10-year low, with steeper declines projected
    due to lower birth rates and fewer international students. The district has not shuttered a campus
    in decades.
  sources:
