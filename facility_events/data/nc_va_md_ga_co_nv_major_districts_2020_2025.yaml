  schools_affected:
  - name: Billingsville Elementary (renovation)
  - name: Sedgefield Elementary (renovation to Montessori magnet)
  - name: Marie G. Davis School (renovation to Montessori 7-12 magnet)
  description: The first projects from the 2023 $2.5 billion bond were completed by August 2025. Billingsville
    and Sedgefield elementaries and Marie G. Davis School were renovated and reopened as Montessori magnet
    schools, replacing the older Chantilly, Park Road, and J.T. Williams buildings. Sedgefield moved pre-K-2
    students into the Dilworth building in August 2024 as part of the transition.
