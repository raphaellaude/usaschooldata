  description: 'A new middle school on Stumptown Road in Huntersville is scheduled for completion in August
    2028. It will relieve crowding in northern schools, allow the district to add magnet seats, and absorb
    students from Davidson K-8 when that school converts to an elementary school. CMS is also converting
    several schools: Thomasboro PreK-8 becomes elementary only, University Park Creative Arts becomes
    a full K-5 arts magnet, and Rea Farms STEAM becomes a full K-8 magnet.'
