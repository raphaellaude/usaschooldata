  state: CA
  leaid: '06225000'
  event_type: closure
  date: 2020-12
  schools_affected:
  - name: Hudson Elementary School (middle school grades eliminated)
  description: The LBUSD Board of Education voted to eliminate middle school-grade offerings at Hudson
    Elementary in West Long Beach, citing dangerously low enrollment. The school's utilization rate had
    fallen below 20%. Hudson was originally built to host over 1,300 students. District-wide enrollment
    had fallen from ~75,000 in 2017-18 to below 64,000.
