  event_type: renovation
  date: 2025-08
  schools_affected:
  - name: Frankford High School
  description: After nearly two years of closure, Frankford High School reopened on August 18, 2025, following
    a $29.9 million renovation. The work included asbestos removal and remediation, installation of 6,000
    panels to contain remaining fibers, new ceilings with LED lighting, vinyl tile flooring, refinished
    wood floors, smartboards in every classroom, new windows, and 80+ new air conditioning units. The
    school welcomed ~1,000 students. In a related development, the district faced federal criminal charges
    for asbestos regulation violations, the first in the nation, resulting in a deferred prosecution agreement
    with five years of court monitoring.
