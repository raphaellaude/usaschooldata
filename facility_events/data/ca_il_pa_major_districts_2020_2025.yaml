- event_id: CA-06227100-bond-202011-los-angeles-unified-school-dis
  district: Los Angeles Unified School District
  state: CA
  leaid: '06227100'
  event_type: bond
  date: 2020-11
  schools_affected:
  - name: All LAUSD schools (district-wide, 750+ sites)
  description: Voters overwhelmingly approved Measure RR, a $7 billion general obligation bond for school
    facility improvements, with nearly 71% support (55% threshold required). Funds designated for upgrading
    70% of district facilities in need of repairs, replacing aging HVAC and plumbing systems, retrofitting
    buildings, installing security and communication systems, and accessibility upgrades. More than 77%
    of LAUSD's 750 school sites are at least 50 years old and 13% are 100+ years old. Bond extends existing
    tax rate of $21.74 per $100,000 assessed value through 2055, raising ~$329 million annually.
  sources:
  - url: https://www.cbsnews.com/losangeles/news/voters-approve-measure-rr-7-billion-bond-lausd-facility-improvements/
  causes:
  - accountability
  - budget_fiscal
  - facility_condition
  - new_construction
  - political_governance
  - safety_security
- event_id: CA-06227100-bond-202411-los-angeles-unified-school-dis
  district: Los Angeles Unified School District
  state: CA
  leaid: '06227100'
  event_type: bond
  date: 2024-11
  schools_affected:
  - name: All LAUSD schools (district-wide)
  description: LA voters overwhelmingly approved Measure US, LAUSD's largest-ever school facilities bond
    at $9 billion, with 68% of the vote. The bond will fund repair and upgrade of aging school buildings,
    addressing more than $80 billion in unfunded school facility and technology needs. More than 60% of
    LAUSD campuses are at least a half-century old. Cost to property owners estimated at $25.04 per $100,000
    of assessed value per year. Supported by the school board, Superintendent Carvalho, UTLA, and local
    construction groups.
  sources:
  - url: https://www.the74million.org/article/la-voters-overwhelmingly-approve-9-billion-school-bond/
  causes:
  - facility_condition
  - new_construction
  - political_governance
- event_id: CA-06227100-bond-201906-los-angeles-unified-school-dis
  district: Los Angeles Unified School District
  state: CA
  leaid: '06227100'
  event_type: bond
  date: 2019-06
  schools_affected:
  - name: N/A - measure failed
  description: LAUSD Measure EE, a parcel tax of 16 cents per square foot that would have raised approximately
    $500 million annually for 12 years, was decisively defeated by voters in a June 2019 special election.
    The measure received only 45.68% support, falling far short of the required two-thirds supermajority.
    The tax was considered vital to cover costs of salary agreements made with UTLA to resolve the January
    2019 teachers' strike. The Howard Jarvis Taxpayers Association had filed a lawsuit to block the election,
    but it became moot after voter rejection.
  sources:
  - url: https://edsource.org/2019/voters-in-la-soundly-reject-parcel-tax-for-schools/613344
  causes:
  - legal_challenges
  - political_governance
- event_id: CA-06227100-renovation-202311-los-angeles-unified-school-dis
  district: Los Angeles Unified School District
  state: CA
  leaid: '06227100'
  event_type: renovation
  date: 2023-11
  schools_affected:
  - name: 32nd Street USC Magnets
  - name: Los Angeles High School
  - name: Wilmington Middle School STEAM Magnet
  description: The LAUSD Board of Education approved more than $195.7 million in bond-funded projects
    for facility upgrades. The 32nd Street USC Magnets received approval for a $108 million multi-phase
    modernization project to construct 23 new general and specialty classrooms (media, filmmaking, engineering,
    graphic design, chemistry lab), plus exterior improvements, greening, landscaping, infrastructure,
    and ADA upgrades. The Board also approved $45 million for wellness center facilities at Los Angeles
    High School and Wilmington Middle School STEAM Magnet.
  sources:
  - url: https://www.lausd.org/site/Default.aspx?PageType=3&DomainID=4&PageID=1&ViewID=6446ee88-d30c-497e-9316-3f8874b3e108&FlexDataID=139921
  causes:
