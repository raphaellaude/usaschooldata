- event_id: IL-17099300-closure-201802-chicago-public-schools
  district: Chicago Public Schools
  state: IL
  leaid: '17099300'
  event_type: closure
  date: 2018-02
  schools_affected:
  - name: Robeson High School (closed June 2018)
  - name: Harper High School (phased out by 2021)
  - name: Hope High School (phased out by 2021)
  - name: TEAM Englewood High School (phased out by 2021)
  description: The CPS Board voted unanimously to close four Englewood high schools over three years to
    make way for a new STEM school. Robeson closed immediately (June 2018) for construction of the replacement
    campus. Harper, Hope, and TEAM Englewood were phased out over three years so existing students could
    finish at their current schools. The closures came just after the expiration of a five-year moratorium
    on school closures imposed after the 2013 mass closures. More than 16 public schools have closed in
    Englewood since 2001.
  sources:
  - url: https://news.wttw.com/2018/02/28/cps-board-votes-unanimously-close-4-englewood-high-schools
