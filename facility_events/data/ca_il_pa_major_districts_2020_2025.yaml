  description: The School District of Philadelphia released a $2.8 billion Proposed Facilities Master
    Plan. The plan recommends closing 20 schools (18 in Northeast, Northwest, or West Philadelphia), co-locating
    or merging 6 schools, and upgrading 159 others, with changes scheduled for the 2027-28 school year.
    The plan includes $1 billion in district bond funding and requests $1.8 billion in new government/philanthropic
    funding. Goals include reducing buildings rated Unsatisfactory or Poor from 85 to 0. The district
    has classroom space for 180,000 students but serves only 116,000. The plan drew immediate opposition
    from families, educators, and elected officials.
