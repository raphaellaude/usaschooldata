  - new_construction
- event_id: CA-06227100-renovation-202006-los-angeles-unified-school-dis
  district: Los Angeles Unified School District
  state: CA
  leaid: '06227100'
  event_type: renovation
  date: 2020-06
  schools_affected:
  - name: Ulysses S. Grant High School
  - name: Shenandoah Elementary School
  - name: North Hollywood High School
  - name: Multiple campuses (650+ projects in pre-construction)
  description: LAUSD's Facilities Services Division was managing 650+ projects in pre-construction valued
    at $3.7 billion and 220 projects under construction valued at $1.6 billion. Notable projects included
    the nearly $150 million comprehensive modernization of Grant High School (completion targeted 2024)
    and the $54 million upgrade of Shenandoah Elementary (targeted completion end of 2023). North Hollywood
    High School underwent comprehensive modernization including seismic upgrade of ~100,000 SF and construction
    of a new classroom building, auditorium, and gymnasium. Over 120 new bond program projects were planned
    for bid between June 2020 and June 2021.
  sources:
  - url: https://www.enr.com/articles/49754-school-construction-could-help-la-rebound-from-pandemic
  causes:
  - facility_condition
  - new_construction
- event_id: CA-06227100-closure-202003-los-angeles-unified-school-dis
  district: Los Angeles Unified School District
  state: CA
  leaid: '06227100'
  event_type: closure
  date: 2020-03
  schools_affected:
  - name: All LAUSD schools (district-wide, temporary)
  description: LAUSD closed all schools in March 2020 due to the COVID-19 pandemic, affecting approximately
    600,000+ students at the time. The district extended closures through the remainder of the 2019-20
    school year and continued remote learning into the 2020-21 school year. LAUSD was one of the last
    major urban districts to reopen for in-person instruction, not fully returning until spring 2021.
    The district invested in ventilation upgrades, though a June 2020 GAO study found 40% of schools nationwide
    needed HVAC updates or replacements.
  sources:
  - url: https://capitalandmain.com/school-districts-ventilation-systems-reveal-haves-and-have-nots
  causes:
  - covid_pandemic
  - facility_condition
- event_id: CA-06227100-closure-202501-los-angeles-unified-school-dis
  district: Los Angeles Unified School District
  state: CA
  leaid: '06227100'
  event_type: closure
  date: 2025-01
  schools_affected:
  - name: Palisades Charter Elementary School
  - name: Marquez Charter Elementary School
  - name: Palisades Charter High School
  - name: Canyon Charter Elementary (adjacent to burn scar)
  - name: Paul Revere Charter Middle School (adjacent to burn scar)
  description: 'The January 2025 Palisades Fire destroyed or severely damaged three LAUSD schools. Marquez
    Elementary was burned to the ground. Palisades Elementary lost ~70% of its campus (17 classrooms,
    multipurpose room, play equipment). Palisades High lost ~30% (21 classrooms, storage, track and field).
    Students were relocated: 410 Palisades Elementary students to Brentwood Science Magnet, 312 Marquez
    students to Nora Sterry Elementary, and Palisades High students to a renovated Sears building in Santa
    Monica. Palisades Elementary enrollment dropped 25% post-fire.'
  sources:
  - url: https://laist.com/news/education/los-angeles-unified-palisades-fire-reconstruction-one-year-anniversary
  causes:
  - enrollment_decline
  - natural_disaster
- event_id: CA-06227100-expansion-202501-los-angeles-unified-school-dis
  district: Los Angeles Unified School District
  state: CA
  leaid: '06227100'
  event_type: expansion
  date: 2025-01
  schools_affected:
  - name: Palisades Charter Elementary School (rebuild)
  - name: Marquez Charter Elementary School (rebuild)
  - name: Palisades Charter High School (rebuild)
  description: The LAUSD Board of Education approved a $604 million plan to rebuild the three schools
    destroyed in the Palisades Fire. Reconstruction is set to conclude by end of 2028, restoring facilities
    for approximately 3,620 students. Funding comes primarily from the $9 billion Measure US bond approved
    by voters in November 2024, with $337.6 million earmarked for elementary school modernization and
    $266.6 million for high school upgrades. Designs incorporate wildfire resiliency as a core requirement,
    including fire-resistant concrete blocks, enhanced air filtration, and strategic landscaping.
  sources:
  - url: https://palisadesnews.com/lausd-approves-604-million-plan-to-rebuild-fire-damaged-palisades-schools/
  causes:
  - natural_disaster
  - new_construction
  - political_governance
- event_id: CA-06227100-closure-202502-los-angeles-unified-school-dis
  district: Los Angeles Unified School District
  state: CA
  leaid: '06227100'
  event_type: closure
  date: 2025-02
  schools_affected:
  - name: Consolidations planned for 2027-28 (specific schools TBD)
  description: LAUSD announced that budget cuts to school budgets will begin in the 2026-27 school year,
    with school consolidations and staffing reductions planned for the 2027-28 school year. The district
    contracted with consulting firm Ernst and Young to create models for closing and consolidating schools.
    LAUSD faces an estimated $1.6 billion deficit for 2027-28. In 2024-25, the district spent ~$2 billion
    more than revenue. Thirty-four schools have fewer than 200 students; nearly half of 456 zoned elementary
    schools are half-full or less; 56 have seen enrollment fall 70%+. Board member Tanya Ortiz Franklin
    called for a plan, while Board President Schmerelson acknowledged fear of community backlash.
  sources:
  - url: https://www.the74million.org/article/layoffs-cuts-and-closures-are-coming-to-lausd-schools-as-district-confronts-budget-shortfalls/
  causes:
  - budget_fiscal
  - consolidation_efficiency
  - underutilization
- event_id: CA-06227100-redistricting-202112-los-angeles-unified-school-dis
  district: Los Angeles Unified School District
  state: CA
  leaid: '06227100'
  event_type: redistricting
  date: 2021-12
  schools_affected:
  - name: All LAUSD Board of Education districts (political boundaries)
  description: The LA City Council approved new LAUSD Board of Education district boundaries 14-0, following
    recommendations from the LAUSD Redistricting Commission. The map was nearly identical to the commission's
    recommendation, with one adjustment to keep Carver Middle School and Sally Ride Elementary School
    in District 5. The redistricting was required by the LA City Charter every 10 years based on updated
    census data.
  sources:
  - url: https://www.dailynews.com/2021/12/01/redistricting-new-lausd-boundaries-approved-la-city-council-map-must-wait-a-bit/
  causes:
  - redistricting_rezoning
- event_id: CA-06227100-redistricting-202402-los-angeles-unified-school-dis
  district: Los Angeles Unified School District
  state: CA
  leaid: '06227100'
  event_type: redistricting
  date: 2024-02
  schools_affected:
  - name: ~200 school buildings placed off-limits to charter co-location
  description: The LAUSD Board voted 4-3 to approve a new policy limiting charter school co-location under
    Proposition 39. The policy barred charter schools from sharing campuses with community schools, Black
    Student Achievement Plan (BSAP) schools, and the district's 100 schools targeted for academic improvement.
    Roughly 200 of the district's 770 school buildings were placed off-limits. UTLA supported the policy;
    the California Charter Schools Association opposed it and filed suit. In 2025, a judge ruled the policy
    violated Proposition 39 and reopened up to 346 school sites for potential charter co-locations.
  sources:
  - url: https://laist.com/news/education/lausd-charter-school-co-location-proposition-39-vote-february-2024
  causes:
  - charter_competition
  - legal_challenges
  - new_construction
  - political_governance
  - racial_equity
- event_id: CA-06343200-bond-202211-san-diego-unified-school-distr
  district: San Diego Unified School District
  state: CA
  leaid: '06343200'
  event_type: bond
  date: 2022-11
  schools_affected:
  - name: All SDUSD schools (district-wide)
  description: San Diego voters approved Measure U, a $3.2 billion general obligation bond measure, with
    65.28% support. This was the district's fourth bond measure since 2008, bringing the total facilities
    bond program to $11.5 billion across Proposition S ($2.1B, 2008), Proposition Z ($2.8B, 2012), Measure
    YY ($3.4B, 2018), and Measure U. Funds support renovation, repair, and revitalization of school facilities
    including HVAC systems, new classroom buildings, roofs, parking lots, solar power systems, and athletic
    facilities. San Diego Unified pays the lowest interest rate of all districts in the state based on
    its most recent bond issuance.
  sources:
  - url: https://voiceofsandiego.org/2022/09/21/san-diego-unifieds-latest-bond-ask-measure-u-explained/
  causes:
  - facility_condition
  - new_construction
  - political_governance
- event_id: CA-06343200-expansion-202208-san-diego-unified-school-distr
  district: San Diego Unified School District
  state: CA
  leaid: '06343200'
  event_type: expansion
  date: 2022-08
  schools_affected:
  - name: Logan Memorial Educational Campus
  description: San Diego Unified completed the Logan Memorial Educational Campus, a $100+ million TK-12
    education complex in Logan Heights -- the first high school the neighborhood had ever had. The existing
    Logan K-8 and Memorial Prep campuses were rebuilt into a 241,000 sq ft campus on 19.8 acres with capacity
    for 2,060 students. The project won a 2023 CMAA Project Achievement Award. In December 2024, the district
    unveiled El Nido, a "cradle-to-college and career" infant/toddler Montessori Center at the campus,
    developed in partnership with Harvard University.
  sources:
  - url: https://spaces4learning.com/articles/2024/05/28/logan-memorial-educational-campus.aspx
  causes:
  - population_growth
