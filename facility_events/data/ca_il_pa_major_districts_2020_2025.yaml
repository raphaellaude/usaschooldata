- event_id: IL-17099300-renovation-202107-chicago-public-schools
  district: Chicago Public Schools
  state: IL
  leaid: '17099300'
  event_type: renovation
  date: 2021-07
  schools_affected:
  - name: 36 schools (ADA accessibility improvements)
  - name: Multiple schools (roof, envelope, mechanical projects)
  description: CPS's FY2021 capital plan totaled $758 million, including $20 million for ADA accessibility
    improvements at 36 schools as part of a new $100 million, five-year commitment to make all CPS buildings
    first-floor accessible. Improvements targeted parking lots, main entrances, main offices, and public
    restrooms. The plan also funded critical facility needs including roof, building envelope, mechanical,
    electrical, and plumbing repairs, plus full-day Pre-K expansions. CPS estimated it would cost $598
    million total to make all schools fully wheelchair accessible. Since FY2016, CPS had invested over
    $2.1 billion in capital improvements.
  sources:
  - url: https://www.cps.edu/about/finance/capital-plan/capital-plan-fy2021
  causes:
  - facility_condition
  - new_construction
