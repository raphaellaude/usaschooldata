  date: 2021-04
  schools_affected:
  - name: SEED LA Charter School (South Los Angeles)
  description: The SEED LA Charter School project, a $97.4 million construction effort (including $70+
    million in New Markets Tax Credit funding), closed financing in April 2021 with expected completion
    in January 2023. The project created a 147,479 sq ft educational facility comprising classrooms, offices,
    common areas, 20 staff apartments, and 170 dormitory units housing 400 students -- a public college-prep
    boarding high school in South LA providing STEM and humanities curriculum. Created 92 permanent jobs
    and 150 construction jobs.
