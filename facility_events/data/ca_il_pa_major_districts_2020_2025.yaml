  district: Chicago Public Schools
  state: IL
  leaid: '17099300'
  event_type: expansion
  date: 2019-09
  schools_affected:
  - name: Englewood STEM High School
  description: Englewood STEM High School opened on September 3, 2019, as the first new school in the
    Englewood neighborhood since the 1970s. The $85 million state-of-the-art facility was built on the
    former Robeson campus and includes gleaming science labs, an 800-person gymnasium, sports fields,
    and specialized after-school programs. Upperclassmen can earn college credits through a partnership
    with Kennedy-King College. The school took in more than 400 freshmen its first year. It replaced four
    closed Englewood high schools that had suffered from declining enrollment, with ~90% of neighborhood
    students previously attending high schools outside of Englewood.
