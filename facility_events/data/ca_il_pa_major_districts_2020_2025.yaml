  district: Long Beach Unified School District
  state: CA
  leaid: '06225000'
  event_type: closure
  date: 2024-06
  schools_affected:
  - name: Hudson Elementary School (full closure)
  description: The LBUSD Board of Education approved a plan to fully close Hudson Elementary at the end
    of the academic year. The West Long Beach campus enrolled only 231 students with just one teacher
    per grade level (K-5). Hudson was originally built for over 1,300 students. Starting in fall, the
    majority of Hudson students will attend Garfield Elementary School, about a half mile away. The closure
    is the latest symptom of declining enrollment district-wide.
  sources:
  - url: https://lbpost.com/news/education/lbusd-board-votes-to-close-hudson-elementary-school-next-year/
