  district: Chicago Public Schools
  state: IL
  leaid: '17099300'
  event_type: renovation
  date: 2022-07
  schools_affected:
  - name: 33 schools (ADA accessibility improvements)
  - name: 750+ active projects district-wide
  description: CPS's FY2022 capital plan totaled $706.6 million, including $20.5 million for ADA accessibility
    at 33 schools, continuing the multi-year $100 million commitment. As of April 2022, over 750 active
    projects were underway district-wide, prioritizing mechanical systems for indoor air quality, full-day
    Pre-K expansions, restroom modernizations, student recreation and athletic improvements, and technology
    upgrades. CPS developed its first Equity Index tool to prioritize resources for schools in greatest
    need.
  sources:
  - url: https://www.cps.edu/about/finance/capital-plan/capital-plan-fy2022/
  causes:
  - new_construction
  - racial_equity
