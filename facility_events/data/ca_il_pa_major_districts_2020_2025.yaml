  - name: Mitchell Elementary School
  - name: C.W. Henry Elementary
  - name: Universal Vare Charter School
  description: Six Philadelphia schools were abruptly closed between March and May 2023 due to asbestos
    contamination found in aging buildings. Building 21, in a 100-year-old structure, closed first in
    March; students relocated to Strawberry Mansion High School. Frankford High (900 students displaced)
    and others followed in April-May. Previous 1990s sampling had incorrectly labeled some materials as
    non-asbestos-containing. Asbestos exists in 295 of the district's 329 buildings, with ~80% of schools
    built before 1978. Board President called the issues "a hundred years in the making" caused by "decades
    upon decades of disinvestment."
