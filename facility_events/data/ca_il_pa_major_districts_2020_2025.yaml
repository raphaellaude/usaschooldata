- event_id: CA-06227100-closure-202020-la-charter-schools-within-laus
  district: LA Charter Schools (within LAUSD footprint)
  state: CA
  leaid: '06227100'
  event_type: closure
  date: 2020-2024
  schools_affected:
  - name: 17+ charter schools closed since 2019-20
  - name: Multiple Alliance for College-Ready Public Schools campuses
  - name: Multiple Green Dot Public Schools campuses
  description: Across LA Unified's footprint, at least 17 charter schools have closed since the 2019-20
    school year, with low enrollment as the typical common denominator. Some of the most prominent charter
    operators in LA -- including Alliance for College-Ready Public Schools and Green Dot Public Schools
    -- closed one or more campuses. Statewide in California, from 2021 to 2023, 31 new charter schools
    opened but 63 closed. National charter enrollment grew by 370,000 students between 2018-19 and 2020-21
    even as traditional public school enrollment declined.
  sources:
  - url: https://edsource.org/2025/lausd-charter-school-conflict/741518
  causes:
