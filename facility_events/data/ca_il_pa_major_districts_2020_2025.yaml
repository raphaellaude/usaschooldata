- event_id: IL-17099300-closure-202003-chicago-public-schools
  district: Chicago Public Schools
  state: IL
  leaid: '17099300'
  event_type: closure
  date: 2020-03
  schools_affected:
  - name: All CPS schools (district-wide, temporary)
  description: Following Governor Pritzker's mandate, all CPS schools were closed from March 17, 2020,
    with the closure extended through the remainder of the 2019-20 school year (June 18, 2020). Students
    transitioned to remote learning. For the 2020-21 school year, CPS began with full remote learning
    in September 2020, then implemented a phased hybrid return starting with Pre-K and cluster programs
    in the second quarter. The reopening was contentious, with the Chicago Teachers Union threatening
    strikes over safety concerns.
