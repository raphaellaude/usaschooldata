  district: LA Charter Schools (within LAUSD footprint)
  state: CA
  leaid: '06227100'
  event_type: closure
  date: 2024-02
  schools_affected:
  - name: KIPP Pueblo Unido (Maywood, LAUSD-authorized)
  - name: KIPP Generations Academy (Gardena, LAUSD-authorized)
  - name: KIPP Poder Public School (Montebello, County-authorized)
  description: On February 1, 2024, KIPP SoCal Public Schools board voted to close three of its schools
    due to low enrollment. KIPP Pueblo Unido and KIPP Generations were LAUSD-authorized; KIPP Poder was
    authorized by the LA County Board of Education. The closures reflect broader enrollment challenges
    facing both traditional public schools and charter networks in the region.
