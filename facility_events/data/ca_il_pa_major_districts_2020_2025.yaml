  district: Chicago Public Schools
  state: IL
  leaid: '17099300'
  event_type: renovation
  date: 2023-09
  schools_affected:
  - name: All 522 CPS campuses (facilities master plan)
  description: CPS released its 2023 Educational Facilities Master Plan, finding that the district would
    need $14.4 billion to address emergency building repairs and fully modernize all 522 school buildings,
    with $3 billion in critical needs. The plan determined that 293 of 497 schools (59%) were underutilized
    (less than 70% capacity), and 163 schools (one-third) were less than half full. The average campus
    was built in 1940, with 70 facilities dating to before 1900. CPS held 16 neighborhood-specific roundtable
    discussions from December 2023 through February 2024 to gather community input on priorities for repair,
    construction, and investment.
