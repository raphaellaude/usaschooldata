  schools_affected:
  - name: Long Beach Polytechnic High School
  description: LBUSD kicked off the $450 million transformation of Long Beach Polytechnic High School
    (Poly), one of the district's most iconic campuses. The historic, multi-phase project is designed
    to reimagine the campus with new learning spaces and cutting-edge academic facilities. The project
