  district: San Diego Unified School District
  state: CA
  leaid: '06343200'
  event_type: expansion
  date: 2023-01
  schools_affected:
  - name: Civita Elementary School (planned new construction)
  description: San Diego Unified approved plans to build a brand new elementary school in the Civita neighborhood
    of Mission Valley, where a population boom made a new school necessary. The district approved purchasing
    land from Civita developer Sudberry Properties for a 2-story, 24-classroom campus that will hold 500-600
    students, located at Civita Boulevard and Via Alta. The district moved to secure the property after
    charter schools expressed interest in the site. Funding comes from voter-approved bond programs.
  sources:
  - url: https://www.10news.com/news/local-news/san-diego-unified-plans-to-build-a-new-elementary-school-in-civita-neighborhood
