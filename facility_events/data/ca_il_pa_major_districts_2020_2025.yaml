  state: CA
  leaid: '06225000'
  event_type: bond
  date: 2022-11
  schools_affected:
  - name: All LBUSD schools (district-wide)
  description: Long Beach voters passed a $1.7 billion bond measure allowing the district to upgrade schools
    by improving plumbing systems, maintaining safe drinking water, renovating facilities, and adding
    air conditioning systems. The bond is managed alongside existing Measure E, Measure K, and Measure
    Q programs with oversight from the Citizens' Bonds Oversight Committee. The district also adopted
    a sustainability plan in July 2022 to meet clean energy goals by 2045.
