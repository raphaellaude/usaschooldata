  date: 2024-09
  schools_affected:
  - name: No schools closed (moratorium established)
  description: In September 2024, a major controversy erupted when the Chicago Teachers Union (CTU) said
    it obtained a facilities analysis identifying 70 schools that could be consolidated with 70 others,
    potentially affecting 100+ schools. CPS CEO Pedro Martinez firmly denied closure plans, calling the
    interpretation false. The CTU House of Delegates passed a vote of no confidence in Martinez. On September
    26, 2024, the CPS Board voted unanimously to prohibit any school closures or consolidations through
    January 2027, extending a state legislative moratorium that was set to expire in January 2025. The
    district has 61 schools at 30% or less occupancy, compared to 17 at the time of the 2013 mass closures.
