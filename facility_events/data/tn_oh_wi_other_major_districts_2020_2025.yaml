    date: "2024-01-01"
    schools_affected:
      - "New St. Ville Elementary (under construction at existing site)"
      - "Second new campus (planned)"
    description: >
      Jefferson Parish in final stages of designing two new $48 million schools.
      St. Ville Elementary students temporarily absorbed into Woodmere Elementary
      while new school built at current St. Ville site. Superintendent James Gray
      said no additional consolidations planned for 2024, but more likely
      "near-term."
    source_url: "https://www.nola.com/news/education/jefferson-parish-wont-close-more-schools-in-2024/article_748beb74-ab45-11ee-9fac-c7877cd3ad55.html"

