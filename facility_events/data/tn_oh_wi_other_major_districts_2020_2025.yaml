      As of October 2024, 47,667 students enrolled in 70 NOLA Public Schools,
      reflecting continued post-pandemic decline. District facing potential
      $49 million budget shortfall driven by too many empty seats. "The budget
      issue would not be as bad if we were fully enrolled," said FirstLine
      Schools CEO. Further campus closures expected.
    source_url: "https://lailluminator.com/2025/08/27/schools-katrina/"

