  - name: ASD Charter School 2
  - name: ASD Charter School 3
  - name: ASD Charter School 4
  description: Four Achievement School District charter schools closed when their charter contracts expired
    in summer 2024 after the MSCS board denied renewal applications. Five ASD charter schools had faced
    uncertain futures; the board approved only two charter applications for 2024-25 while denying seven
    others. The ASD model was widely acknowledged as a failure by Tennessee lawmakers.
