  district: Memphis-Shelby County Schools
  state: TN
  leaid: '47001480'
  event_type: closure
  date: '2025-09-24'
  schools_affected:
  - name: Georgian Hills Elementary
  - name: 3 additional schools (names pending board vote)
  description: MSCS leaders recommended closing four schools and transferring one to a neighboring suburban
    district by end of academic year 2025-26. Schools in Northwest and Southwest regions were chosen due
    to underenrollment and high deferred maintenance. The district faces over $1.6 billion in building
    repairs over the next decade, with 10 buildings reaching end of useful life. Eight MSCS schools enrolled
    fewer than 150 students in 2023-24.
