  # --- NYC Department of Education / NYC Public Schools ---

  - district_name: "New York City Public Schools"
    state: "NY"
    event_type: "new_construction"
    date: "2024-09-01"
    schools_affected:
      - "24 new school buildings (11,010 new seats)"
    description: >
      Mayor Adams and SCA opened 24 new school buildings for 2024-25 school year
      -- the most new K-12 seats since 2003. Distribution: 9 in Brooklyn, 8 in
      Bronx, 1 in Manhattan, 6 in Queens. Features include modern classrooms,
      advanced technology, green spaces. Addresses overcrowding and state-mandated
      smaller class sizes. In addition to 20,000+ seats added earlier in Adams
      administration. 2025-29 Capital Plan funds another 33,417 seats.
    source_url: "https://www.nyc.gov/office-of-the-mayor/news/675-24/mayor-adams-opens-24-new-school-buildings-ahead-2024-2025-school-year"

  - district_name: "New York City Public Schools"
    state: "NY"
    event_type: "merger"
    date: "2024-10-25"
    schools_affected:
      - "13 school mergers/grade removals approved in 2024 (most since 2018)"
    description: >
      NYC quietly accelerated school mergers as enrollment dropped. Over past
      six years, 35 proposals to merge, close, or remove grades from schools
      passed. 13 approved in 2024 alone (the most in any year since at least
      2018). Roughly two-thirds of affected schools in Brooklyn or Bronx.
      Schools affected had higher proportions of Black, Latino, and low-income
      students than the median city school.
    source_url: "https://www.chalkbeat.org/newyork/2024/10/25/nyc-quietly-accelerates-mergers-of-small-schools-as-enrollment-drops/"

  - district_name: "New York City Public Schools"
    state: "NY"
    event_type: "closure"
    date: "2025-05-01"
    schools_affected:
      - "M.S. 394 (17K394) in Crown Heights"
    description: >
      Panel for Educational Policy voted to close M.S. 394, a Pre-K-8 school
      in Crown Heights, phased out over three school years. Only the third
      closure approved under Mayor Adams. A new Central Brooklyn Literacy
      Academy (for students with dyslexia) will open in the same building --
      the second city-operated school designed for reading challenges.
    source_url: "https://www.chalkbeat.org/newyork/2025/05/01/pep-votes-to-close-ms-394-open-central-brooklyn-literacy-academy/"

  - district_name: "New York City Public Schools"
    state: "NY"
    event_type: "enrollment_decline"
    date: "2025-11-01"
    schools_affected:
      - "112 schools with fewer than 150 students (up from 80 two years ago)"
      - "190 schools with fewer than 200 students (up from 81 in 2016)"
    description: >
      NYC K-12 enrollment fell ~130,000 students (14%) since fall 2016. As of
      Oct 2025, 884,400 students enrolled, down 22,000 (2.4%) year-over-year.
      Nearly two-thirds of ~1,600 schools had fewer students than projected.
      SCA projects enrollment will fall 200,000+ (26%) over next decade.
      Immigration slowdown under federal enforcement has sharply reduced
      migrant enrollment that previously offset declines.
