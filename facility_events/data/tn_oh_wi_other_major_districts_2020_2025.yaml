# School Facility Events Research: 2020-2025
# Focus: Major school districts in TN, OH, WI, IN, MN, LA, NJ, NY and national trends
# Generated from web research on 2026-02-08

events:

  # ============================================================================
  # TENNESSEE
  # ============================================================================

  # --- Shelby County / Memphis-Shelby County Schools (MSCS) ---

  - district_name: "Memphis-Shelby County Schools"
    district_nces_id: "4700148"
    state: "TN"
    event_type: "closure"
    date: "2024-06-01"
    schools_affected:
      - "Humes Middle School"
    description: >
      Humes Middle School, a former Achievement School District charter school,
      closed at the end of the 2023-24 school year after the district denied its
      charter renewal application. Students were redirected to Booker T. Washington
      Middle and High School. The building is under consideration for reuse by
      nonprofit New Ballet as an arts-focused school.
    source_url: "https://www.chalkbeat.org/tennessee/2025/09/24/memphis-leaders-eye-four-schools-for-closure/"

  - district_name: "Memphis-Shelby County Schools"
    district_nces_id: "4700148"
    state: "TN"
    event_type: "closure"
    date: "2024-06-01"
    schools_affected:
      - "ASD Charter School 1 (Frayser Community Schools)"
      - "ASD Charter School 2"
      - "ASD Charter School 3"
      - "ASD Charter School 4"
    description: >
      Four Achievement School District charter schools closed when their charter
      contracts expired in summer 2024 after the MSCS board denied renewal
      applications. Five ASD charter schools had faced uncertain futures; the
      board approved only two charter applications for 2024-25 while denying
      seven others. The ASD model was widely acknowledged as a failure by
      Tennessee lawmakers.
    source_url: "https://www.chalkbeat.org/tennessee/2023/7/17/23797481/memphis-shelby-county-schools-tennessee-achievement-school-district-new-charters-turnaround/"

  - district_name: "Memphis-Shelby County Schools"
    district_nces_id: "4700148"
    state: "TN"
    event_type: "closure_planned"
    date: "2025-09-24"
    schools_affected:
      - "Georgian Hills Elementary"
      - "3 additional schools (names pending board vote)"
    description: >
      MSCS leaders recommended closing four schools and transferring one to a
      neighboring suburban district by end of academic year 2025-26. Schools in
      Northwest and Southwest regions were chosen due to underenrollment and high
      deferred maintenance. The district faces over $1.6 billion in building
      repairs over the next decade, with 10 buildings reaching end of useful life.
      Eight MSCS schools enrolled fewer than 150 students in 2023-24.
    source_url: "https://www.chalkbeat.org/tennessee/2025/09/24/memphis-leaders-eye-four-schools-for-closure/"

  - district_name: "Memphis-Shelby County Schools"
    district_nces_id: "4700148"
    state: "TN"
    event_type: "closure_planned"
    date: "2025-12-18"
    schools_affected:
      - "Up to 15 schools by 2028 (10 additional beyond first 5)"
    description: >
      Long-term facilities plan released December 2025 calls for closing up to
      15 schools by 2028. Five already recommended for 2026 closure. Remaining
      10 closures planned for 2027-2028, mostly in Northwest and Southwest
      regions with the most chronically underenrolled and oldest buildings.
      The ad hoc facilities committee recommended asking Shelby County Commission
      for $750 million to fund repairs and closures over 10 years.
    source_url: "https://www.chalkbeat.org/tennessee/2025/12/18/memphis-school-closure-superintendent-richmond-recommends-15-by-2028/"

  - district_name: "Memphis-Shelby County Schools"
    district_nces_id: "4700148"
    state: "TN"
    event_type: "new_construction"
    date: "2024-05-02"
    schools_affected:
      - "New Cordova Area High School"
      - "New Frayser High School"
    description: >
      MSCS asked Shelby County for over $200 million for construction of two
      new high schools -- one in Cordova area (construction began mid-2024,
      target completion fall 2026) and one for Frayser community. The Cordova
      school replaces capacity lost from state-mandated transfer of Germantown
      schools (3G schools). The board approved land purchase in February 2023.
      This will be the district's first new high school in over a decade.
    source_url: "https://www.chalkbeat.org/tennessee/2024/05/02/memphis-shelby-county-schools-building-capital-funding-request-frayser/"

  # --- Metro Nashville Public Schools (MNPS) ---

  - district_name: "Metro Nashville Public Schools"
    district_nces_id: "4701740"
    state: "TN"
    event_type: "closure"
    date: "2020-05-19"
    schools_affected:
      - "Buena Vista Elementary"
      - "Robert E. Lillard Elementary"
      - "Joelton Middle"
      - "Cohn Learning Center"
    description: >
      Nashville school board unanimously voted to close four schools under the
      ReimaginED consolidation plan, saving an estimated $3.4 million annually.
      Closures driven by declining enrollment due to school choice and charter
      school expansion. At Buena Vista, 62.4% of zoned students exercised
      school choice (39% to charters, 61% to other district schools).
    source_url: "https://tennesseelookout.com/2020/05/19/school-board-votes-to-close-north-nashville-schools-under-consolidation-plan/"

  - district_name: "Metro Nashville Public Schools"
    district_nces_id: "4701740"
    state: "TN"
    event_type: "new_construction"
    date: "2025-08-01"
    schools_affected:
      - "Percy Priest Elementary (new $42.3M building)"
      - "Lakeview Elementary (new $41.7M building)"
      - "Paragon Mills Elementary (new $36.4M building)"
    description: >
      Three new replacement elementary school buildings opened for the 2025-26
      school year totaling over $120M in investment. Percy Priest (800 students,
      Pre-K-5) at 1700 Otter Creek Road features new gymnasium, larger cafeteria,
      wireless projectors. Lakeview (811 students) in Antioch features state-of-
      the-art technology. Paragon Mills also rebuilt on existing campus. Districts
      served saw 12-18% population growth from 2010-2020.
    source_url: "https://www.mnps.org/about/news/news-details/~board/mnps-homepage-news/post/beautiful-and-sustainable-mnps-opens-new-percy-priest-elementary"

  - district_name: "Metro Nashville Public Schools"
    district_nces_id: "4701740"
    state: "TN"
    event_type: "rezoning"
    date: "2025-10-21"
    schools_affected:
      - "Julia Green Elementary (rezoned to Percy Priest)"
      - "Antioch cluster schools"
      - "Glencliff cluster schools"
      - "Hillsboro cluster schools"
    description: >
      For 2025-26, MNPS proposed rezoning changes for Antioch, Glencliff, and
      Hillsboro clusters related to new school openings. A portion of Julia Green
      zone rezoned to new Percy Priest Elementary (approx. 28 students affected).
      Ida B. Wells students to be rezoned to Jere Baxter Middle and Maplewood
      High beginning 2026-27 to eliminate split feeder pattern.
    source_url: "https://www.wsmv.com/2024/10/21/these-are-proposed-rezoning-changes-some-metro-nashville-schools/"

