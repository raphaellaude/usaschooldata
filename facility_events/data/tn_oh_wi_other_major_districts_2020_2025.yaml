  date: '2024-05-02'
  schools_affected:
  - name: New Cordova Area High School
  - name: New Frayser High School
  description: MSCS asked Shelby County for over $200 million for construction of two new high schools
    -- one in Cordova area (construction began mid-2024, target completion fall 2026) and one for Frayser
    community. The Cordova school replaces capacity lost from state-mandated transfer of Germantown schools
    (3G schools). The board approved land purchase in February 2023. This will be the district's first
    new high school in over a decade.
