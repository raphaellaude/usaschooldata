  # --- Columbus City Schools ---

  - district_name: "Columbus City Schools"
    district_nces_id: "3904378"
    state: "OH"
    event_type: "closure"
    date: "2024-12-17"
    schools_affected:
      - "Columbus Alternative High School"
      - "Buckeye Middle School"
      - "Broadleigh Elementary"
      - "Moler Elementary"
      - "West Broad Elementary"
    description: >
      Columbus Board of Education voted to close five schools after months of
      debate. Combined, they enroll over 2,000 students and employ over 120
      teachers. Closures driven by enrollment at less than half of peak levels
      (from 110K to ~47K). A 28-member facilities task force initially considered
      20 schools; the board spared North Linden and Lindbergh. West Broad closure
      contingent on funding for replacement. District downtown offices at
      270 E. State St. also closed, consolidating to South Side building.
      Earliest closures take effect 2026.
    source_url: "https://www.wosu.org/news/2024-12-17/columbus-city-schools-votes-to-close-5-school-buildings-districts-downtown-administration-building"

  - district_name: "Columbus City Schools"
    district_nces_id: "3904378"
    state: "OH"
    event_type: "closure"
    date: "2025-06-01"
    schools_affected:
      - "Duxberry Park Arts Impact Elementary"
      - "Fairwood Alternative Elementary"
      - "Como Elementary"
      - "Columbus Gifted Academy (former Everett Middle)"
    description: >
      As part of $50.4 million in budget cuts, the Columbus Board of Education
      voted to close four additional schools and eliminate numerous staff positions.
      Ohio public schools face $2 billion in state funding cuts over two years.
      The district teachers union issued a scathing statement saying the board
      "should feel shame."
    source_url: "https://www.10tv.com/article/news/local/columbus-city-schools-board-votes-50-million-budget-cuts/530-9fbeed5f-ea5b-435d-9091-c0982ce0c146"

