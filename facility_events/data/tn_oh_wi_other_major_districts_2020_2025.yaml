  schools_affected:
  - name: Columbus Alternative High School
  - name: Buckeye Middle School
  - name: Broadleigh Elementary
  - name: Moler Elementary
  - name: West Broad Elementary
  description: Columbus Board of Education voted to close five schools after months of debate. Combined,
    they enroll over 2,000 students and employ over 120 teachers. Closures driven by enrollment at less
    than half of peak levels (from 110K to ~47K). A 28-member facilities task force initially considered
    20 schools; the board spared North Linden and Lindbergh. West Broad closure contingent on funding
    for replacement. District downtown offices at 270 E. State St. also closed, consolidating to South
    Side building. Earliest closures take effect 2026.
  sources:
