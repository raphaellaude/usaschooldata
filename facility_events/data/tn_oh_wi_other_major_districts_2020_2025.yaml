  # --- Milwaukee Public Schools ---

  - district_name: "Milwaukee Public Schools"
    state: "WI"
    event_type: "facilities_plan"
    date: "2024-10-01"
    schools_affected:
      - "Brown Street Academy"
      - "Clarke Street Academy"
      - "Siefert School"
      - "Starms Discovery Learning Center"
      - "Auer Avenue School"
      - "Hopkins Lloyd Community School"
      - "Jackson Elementary School"
      - "Dr. George Washington Carver Academy"
      - "Oliver Wendell Holmes School"
      - "Andrew S. Douglas Middle School"
      - "Keefe Avenue School"
      - "Robert M. LaFollette School"
      - "William T. Sherman School"
    description: >
      MPS identified 13 schools for potential closure or merger as part of a
      long-range facilities plan developed with consultant Perkins Eastman.
      Enrollment down 32% over 20 years (from 100K+ to ~65K). Buildings average
      80+ years old. Criteria: enrollment less than 50% of capacity, declining
      enrollment over 5 years, less than 1 mile from another underenrolled school.
      36 schools below 70% capacity, 14 schools less than half-full. Closures
      not planned until 2027-28 school year. MPS superintendent said "much more
      than 5" schools will eventually close or merge.
    source_url: "https://www.wisn.com/article/milwaukee-public-schools-names-schools-to-consider-for-closure/62720137"

  - district_name: "Milwaukee Public Schools"
    state: "WI"
    event_type: "bond_referendum"
    date: "2024-04-01"
    schools_affected: []
    description: >
      Milwaukee voters narrowly approved a $252 million school referendum to
      support operations and facilities. The vote came as the district faces
      severe financial pressure from declining enrollment and aging infrastructure.
      Over three decades, building count decreased only 3.9% despite a 29.1%
      drop in enrollment.
    source_url: "https://urbanmilwaukee.com/2024/10/05/mps-considers-closing-merging-schools/"

