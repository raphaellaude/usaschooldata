  district: Memphis-Shelby County Schools
  state: TN
  leaid: '47001480'
  event_type: closure
  date: '2025-12-18'
  schools_affected:
  - name: Up to 15 schools by 2028 (10 additional beyond first 5)
  description: Long-term facilities plan released December 2025 calls for closing up to 15 schools by
    2028. Five already recommended for 2026 closure. Remaining 10 closures planned for 2027-2028, mostly
    in Northwest and Southwest regions with the most chronically underenrolled and oldest buildings. The
    ad hoc facilities committee recommended asking Shelby County Commission for $750 million to fund repairs
    and closures over 10 years.
  sources:
  - url: https://www.chalkbeat.org/tennessee/2025/12/18/memphis-school-closure-superintendent-richmond-recommends-15-by-2028/
  causes:
