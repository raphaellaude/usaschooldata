  # --- Indianapolis Public Schools ---

  - district_name: "Indianapolis Public Schools"
    district_nces_id: "1804770"
    state: "IN"
    event_type: "closure"
    date: "2023-06-01"
    schools_affected:
      - "Francis Bellamy PreK Center"
      - "Floro Torrence School 83"
      - "Paul Miller School 114"
      - "Raymond Brandes School 65"
      - "George Buck School 94"
      - "Francis Parker Montessori School 56"
    description: >
      Under the Rebuilding Stronger plan unanimously approved by the IPS board,
      six school buildings closed at end of 2022-23 school year, displacing over
      1,200 students and 300 staff. Driven by enrollment decline from 27,988 in
      2015-16 to 19,596 in 2022-23 in traditional schools. Four buildings
      assigned reuse plans including partnership with Indiana School for the
      Blind. District also reconfigured grades, expanded IB/Montessori/dual
      language programs, and created standalone middle schools.
    source_url: "https://www.wfyi.org/news/articles/its-time-to-say-goodbye-at-these-6-ips-schools-slated-to-close"

  - district_name: "Indianapolis Public Schools"
    district_nces_id: "1804770"
    state: "IN"
    event_type: "reopening"
    date: "2024-08-01"
    schools_affected:
      - "Broad Ripple Middle School (in former Broad Ripple High School building)"
    description: >
      As part of Rebuilding Stronger, the former Broad Ripple High School
      building (closed 2017) reopened as Broad Ripple Middle School serving
      grades 6-8. This reflects IPS strategy of repurposing closed buildings
      while implementing grade reconfigurations and four enrollment zones.
    source_url: "https://mirrorindy.org/indianapolis-public-schools-broad-ripple-high-rebuilding-stronger-2024/"

  - district_name: "Indianapolis Public Schools"
    district_nces_id: "1804770"
    state: "IN"
    event_type: "legislative_threat"
    date: "2025-01-01"
    schools_affected:
      - "50 IPS schools (proposed charter conversion)"
    description: >
      House Bill 1136 proposed converting 50 IPS schools to charter schools and
      dissolving the district, along with Gary Community Schools and three other
      districts, because more than 50% of students residing in their boundaries
      attend non-district schools. A separate bill would change control over
      school closures and buildings. IPS enrollment: 31,300 total (21,000 in
      district-managed schools). Indianapolis has ~9,000 more seats than enrolled
      students across IPS and charter schools.
    source_url: "https://mirrorindy.org/legislation-would-dissolve-ips-four-other-school-districts/"

