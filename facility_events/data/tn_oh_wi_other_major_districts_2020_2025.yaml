  # --- Minneapolis Public Schools ---

  - district_name: "Minneapolis Public Schools"
    district_nces_id: "2700025"
    state: "MN"
    event_type: "facilities_plan"
    date: "2024-11-01"
    schools_affected:
      - "Potentially 20-30 schools (no specific schools named yet)"
    description: >
      MPS board passed a "transformation resolution" directing the district to
      account for physical space. District built for 45,000 students had only
      28,500 enrolled. 52% of buildings underutilized. Of 55,129 school-aged
      children in Minneapolis, only 28,255 (51%) enrolled in MPS. Superintendent
      Sayles-Adams asked to provide closure/consolidation recommendations by
      April 2026. Budget gap projected at $84.3 million for FY2026. The district
      expected to run out of reserve funds during 2025-26 school year.
    source_url: "https://minnesotareformer.com/2025/10/20/minneapolis-school-board-signals-potential-school-closures/"

