  # --- East Baton Rouge Parish School System ---

  - district_name: "East Baton Rouge Parish School System"
    district_nces_id: "2200840"
    state: "LA"
    event_type: "closure"
    date: "2025-04-28"
    schools_affected:
      - "Bernard Terrace Elementary"
      - "Eva Legard Center"
      - "Ryan Elementary"
      - "Westminster Elementary"
      - "Capitol Middle"
      - "Winbourne Elementary"
      - "J.K. Haynes Elementary"
      - "IDEA Public Schools charter (2 campuses)"
    description: >
      EBR Parish School Board unanimously approved (7-0) a sweeping realignment
      plan closing 9 schools, relocating 4, reconfiguring 7 grade structures,
      and redrawing 12 attendance zones. Over 10,000 students and 1,400+ staff
      affected. The district has capacity for 60,000+ students but educates
      fewer than 40,000, with 20,000 excess seats. The closures remove nearly
      half of the district's F-rated schools and three D-rated schools.
      Superintendent LaMont Cole led the effort in his ninth month.
    source_url: "https://www.wafb.com/2025/04/28/school-board-members-vote-approve-plan-close-consolidate-schools-ebr/"

  - district_name: "East Baton Rouge Parish School System"
    district_nces_id: "2200840"
    state: "LA"
    event_type: "grade_reconfiguration"
    date: "2025-05-01"
    schools_affected:
      - "Melrose Elementary (to K-2 foundational learning center)"
      - "Merrydale Elementary (to K-2 foundational learning center)"
      - "Capitol Elementary (to grades 3-6)"
      - "Glen Oaks Park Elementary (to grades 3-5)"
      - "Scotlandville Middle (expansion from 200 to 400 students)"
      - "Capitol High (moved to Capitol Middle site, grades 7-12)"
    description: >
      As part of the realignment, multiple schools received new grade
      configurations. Melrose and Merrydale become K-2 "foundational learning
      centers" with two teachers per classroom. Capitol and Glen Oaks Park
      shift to upper elementary grades. Scotlandville Middle doubles capacity.
      Capitol High relocates to Capitol Middle site as a 7-12 school.
    source_url: "https://www.wafb.com/2025/04/15/ebr-schools-officials-new-release-details-about-proposed-school-realignment/"

  # --- Jefferson Parish Schools ---

  - district_name: "Jefferson Parish Schools"
    district_nces_id: "2201560"
    state: "LA"
    event_type: "consolidation"
    date: "2023-08-01"
    schools_affected:
      - "Grace King High School (closed, students to Bonnabel & Riverdale)"
      - "Gretna Middle School (closed, students to Marrero Middle)"
      - "Haynes Academy (relocated to Grace King site)"
      - "Thomas Jefferson Academy (relocated to Gretna Middle site)"
      - "St. Ville Elementary (students to Woodmere while new school built)"
    description: >
      Jefferson Parish School Board approved consolidating 7 schools, relocating
      2 schools, creating 1 new Pre-K-8 school, and planning 2 new campuses as
      part of an infrastructure and efficiency plan. Grace King HS and Gretna MS
      absorbed into nearby schools. The closing schools showed lower scores than
      the year before, among the lowest in the district. Part of effort to
      address declining enrollment and shift students from aging buildings.
    source_url: "https://www.wdsu.com/article/jefferson-parish-school-board-votes-in-favor-of-consolidating-schools/43524878"

  - district_name: "Jefferson Parish Schools"
    district_nces_id: "2201560"
    state: "LA"
